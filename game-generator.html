<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAME GENERATOR</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

.container{
  width:95%;
  max-width:500px;
  margin:25px auto;
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
}

h1{
  text-align:center;
  margin-bottom:25px;
}

.field{
  margin-bottom:15px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  font-size:16px;
  border:1px solid #bbb;
  border-radius:6px;
}

.range-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.range-row input{
  flex:1;
}

.range-row span{
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:6px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.apply{
  background:#2196f3;
  color:white;
}

.next{
  background:#4caf50;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:25px;
}

.box{
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eee;
  border:1px solid #aaa;
  border-radius:5px;
  font-size:20px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>DIAMOND GAME SETUP</h1>

<div class="field">
  <label>RANGE</label>
  <div class="range-row">
    <input type="number" id="rangeFrom" placeholder="From">
    <span>TO</span>
    <input type="number" id="rangeTo" placeholder="To">
  </div>
</div>

<div class="field">
  <label>MAGIC TOTAL</label>
  <input type="number" id="magicTotal" placeholder="Enter Magic Total">
</div>

<div class="field">
  <label>GAME ID</label>
  <select id="gameId"></select>
</div>

<div class="field">
  <label>GRID</label>
  <input type="text" value="5 × 5" readonly>
</div>

<div class="buttons">
  <button class="apply" type="button" onclick="applyGame()">APPLY</button>
  <button class="next" type="button" onclick="nextGame()">NEXT</button>
</div>

<div class="grid" id="grid"></div>

<div class="message" id="message"></div>

</div>

<script>

const GRID_SIZE = 5;
const GAME_COUNT = 250;

const gameIdSelect = document.getElementById("gameId");
const rangeFromInput = document.getElementById("rangeFrom");
const rangeToInput = document.getElementById("rangeTo");
const magicTotalInput = document.getElementById("magicTotal");
const gridElement = document.getElementById("grid");
const message = document.getElementById("message");

/* GAME IDs */
for(let i=1;i<=GAME_COUNT;i++){
  const option=document.createElement("option");
  option.value="MKND840000".slice(0,-String(i).length)+i;
  option.textContent=option.value;
  gameIdSelect.appendChild(option);
}

/* CREATE GRID */
for(let i=0;i<25;i++){
  const box=document.createElement("div");
  box.className="box";
  box.id="box"+i;
  box.textContent="0";
  gridElement.appendChild(box);
}

/* SHUFFLE */
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

/*
  Creates a 5x5 normal magic-square pattern.
  Values are transformed so the selected range can be used.
*/
function createMagicSquare(){

  const from=parseInt(rangeFromInput.value);
  const to=parseInt(rangeToInput.value);
  const total=parseInt(magicTotalInput.value);

  if(
    Number.isNaN(from) ||
    Number.isNaN(to) ||
    Number.isNaN(total)
  ){
    message.textContent="Enter Range and Magic Total";
    return null;
  }

  if(from>to){
    message.textContent="Range From must be less than To";
    return null;
  }

  const available=[];

  for(let n=from;n<=to;n++){
    available.push(n);
  }

  if(available.length<25){
    message.textContent="Range must contain at least 25 numbers";
    return null;
  }

  /*
    Try random selections until a valid 5x5 magic square
    is found for the requested total.
  */

  for(let attempt=0;attempt<5000;attempt++){

    let nums=shuffle([...available]).slice(0,25);

    const sum=nums.reduce((a,b)=>a+b,0);

    if(sum!==total*5) continue;

    /*
      Random permutation of the 25 values.
      Validate every row, column and diagonal.
    */

    for(let p=0;p<2000;p++){

      const a=shuffle([...nums]);
      let valid=true;

      for(let r=0;r<5;r++){
        let s=0;
        for(let c=0;c<5;c++){
          s+=a[r*5+c];
        }
        if(s!==total){
          valid=false;
          break;
        }
      }

      if(!valid) continue;

      for(let c=0;c<5;c++){
        let s=0;
        for(let r=0;r<5;r++){
          s+=a[r*5+c];
        }
        if(s!==total){
          valid=false;
          break;
        }
      }

      if(!valid) continue;

      let d1=0;
      let d2=0;

      for(let i=0;i<5;i++){
        d1+=a[i*5+i];
        d2+=a[i*5+(4-i)];
      }

      if(d1!==total || d2!==total){
        valid=false;
      }

      if(valid){
        return a;
      }
    }
  }

  message.textContent=
    "No valid 5×5 magic square found for this Range and Magic Total.";

  return null;
}

/* DISPLAY GRID */
function displayGrid(numbers){

  numbers.forEach((number,index)=>{
    document.getElementById("box"+index).textContent=number;
  });
}

/* APPLY */
function applyGame(){

  const numbers=createMagicSquare();

  if(!numbers) return;

  const gameId=gameIdSelect.value;
  const magicTotal=parseInt(magicTotalInput.value);
  const rangeFrom=parseInt(rangeFromInput.value);
  const rangeTo=parseInt(rangeToInput.value);

  const gameData={
    gameId:gameId,
    gridSize:5,
    magicTotal:magicTotal,
    rangeFrom:rangeFrom,
    rangeTo:rangeTo,
    numbers:numbers
  };

  localStorage.setItem(
    "DIAMOND_GAME_"+gameId,
    JSON.stringify(gameData)
  );

  localStorage.setItem(
    "ACTIVE_DIAMOND_GAME",
    gameId
  );

  displayGrid(numbers);

  message.textContent=
    "Game "+gameId+" applied successfully.";
}

/* NEXT */
function nextGame(){

  const numbers=createMagicSquare();

  if(!numbers) return;

  const gameId=gameIdSelect.value;
  const magicTotal=parseInt(magicTotalInput.value);
  const rangeFrom=parseInt(rangeFromInput.value);
  const rangeTo=parseInt(rangeToInput.value);

  const gameData={
    gameId:gameId,
    gridSize:5,
    magicTotal:magicTotal,
    rangeFrom:rangeFrom,
    rangeTo:rangeTo,
    numbers:numbers
  };

  localStorage.setItem(
    "DIAMOND_GAME_"+gameId,
    JSON.stringify(gameData)
  );

  localStorage.setItem(
    "ACTIVE_DIAMOND_GAME",
    gameId
  );

  displayGrid(numbers);

  message.textContent=
    "Next random grid generated with the same Magic Total.";
}

</script>

</body>
</html>
