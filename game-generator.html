<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5 × 5 Magic Number</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    text-align:center;
}

h1{
    margin:5px 0 15px;
    font-size:25px;
}

.controls{
    max-width:500px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

.row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    align-items:center;
}

.row label{
    width:105px;
    text-align:left;
    font-weight:bold;
}

input,select{
    flex:1;
    padding:10px;
    font-size:16px;
    border:1px solid #aaa;
    border-radius:6px;
}

.buttons{
    display:flex;
    gap:8px;
    margin-top:12px;
}

button{
    flex:1;
    padding:11px;
    border:none;
    border-radius:6px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#applyBtn{
    background:#1976d2;
    color:white;
}

#changeBtn{
    background:#388e3c;
    color:white;
}

.gameArea{
    max-width:500px;
    margin:20px auto;
}

.gameId{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.grid{
    width:min(95vw,430px);
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.box{
    aspect-ratio:1/1;
    background:white;
    border:2px solid #333;
    border-radius:5px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(15px,5vw,25px);
    font-weight:bold;
}

.status{
    margin-top:15px;
    font-size:17px;
    font-weight:bold;
}

#rowTotals,
#colTotals{
    margin-top:8px;
    font-size:14px;
    color:#444;
}
</style>
</head>

<body>

<h1>5 × 5 MAGIC NUMBER</h1>

<div class="controls">

    <div class="row">
        <label>Range From</label>
        <input type="number" id="rangeFrom" value="1">
    </div>

    <div class="row">
        <label>Range To</label>
        <input type="number" id="rangeTo" value="100">
    </div>

    <div class="row">
        <label>Magic Total</label>
        <input type="number" id="magicTotal" value="65">
    </div>

    <div class="buttons">
        <button id="applyBtn" onclick="applySettings()">
            APPLY
        </button>

        <button id="changeBtn" onclick="changeNumberOrder()">
            CHANGE NUMBER ORDER
        </button>
    </div>

</div>


<div class="gameArea">

    <div class="row" style="margin-top:15px;">
        <label>Game ID</label>

        <select id="gameId">
        </select>
    </div>

    <div class="gameId">
        Selected Game ID:
        <span id="selectedGameId">MKND840001</span>
    </div>

    <div class="grid" id="grid">
    </div>

    <div class="status" id="status">
        Enter settings and press APPLY
    </div>

    <div id="rowTotals"></div>
    <div id="colTotals"></div>

</div>


<script>

let currentNumbers = [];
let currentTotal = 0;


/* =========================================
   CREATE GAME ID DROPDOWN
   MKND840001 → MKND840250
========================================= */

const gameIdSelect = document.getElementById("gameId");

for(let i = 1; i <= 250; i++){

    const number = String(i).padStart(3,"0");

    const option = document.createElement("option");

    option.value = "MKND84" + number;
    option.textContent = "MKND84" + number;

    gameIdSelect.appendChild(option);
}


gameIdSelect.addEventListener("change",function(){

    document.getElementById("selectedGameId").textContent =
        this.value;

});


/* =========================================
   CREATE 25 GRID BOXES
========================================= */

const grid = document.getElementById("grid");

for(let i=0;i<25;i++){

    const box = document.createElement("div");

    box.className = "box";

    box.id = "box" + i;

    box.textContent = "-";

    grid.appendChild(box);
}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j = Math.floor(Math.random()*(i+1));

        [array[i],array[j]] =
        [array[j],array[i]];
    }

    return array;
}


/* =========================================
   CREATE 5 × 5 MAGIC POSITION
   Standard 5×5 magic square pattern
========================================= */

function createMagicPositions(){

    const n = 5;

    let square =
    Array.from(
        {length:n},
        ()=>Array(n).fill(0)
    );

    let row = 0;
    let col = Math.floor(n/2);

    for(let num=1;num<=n*n;num++){

        square[row][col] = num;

        let newRow = (row - 1 + n) % n;
        let newCol = (col + 1) % n;

        if(square[newRow][newCol] !== 0){

            row = (row + 1) % n;

        }else{

            row = newRow;
            col = newCol;
        }
    }

    return square;
}


/* =========================================
   FIND 25 UNIQUE NUMBERS
   THAT CAN PRODUCE REQUESTED MAGIC TOTAL
========================================= */

function createNumbers(from,to,total){

    /*
       Every row has 5 numbers.

       Therefore the centre number must be:
       total / 5
    */

    if(total % 5 !== 0){

        return null;
    }

    const center = total / 5;

    if(center < from || center > to){

        return null;
    }


    /*
       We need 12 pairs:

       a + b = 2 × center

       Plus center.

       This makes the total of every
       magic row/column/diagonal correct.
    */

    const candidates = [];

    for(let n=from;n<=to;n++){

        if(n !== center){

            candidates.push(n);
        }
    }


    shuffle(candidates);


    const used = new Set();

    used.add(center);

    const numbers = [center];

    let pairsFound = 0;


    /*
       Randomly search complementary pairs.
    */

    for(let attempt=0; attempt<10000 && pairsFound<12; attempt++){

        if(candidates.length < 2){
            break;
        }

        const a =
            candidates[
                Math.floor(Math.random()*candidates.length)
            ];

        const b =
            (2*center)-a;


        if(
            b >= from &&
            b <= to &&
            b !== a &&
            b !== center &&
            !used.has(a) &&
            !used.has(b)
        ){

            used.add(a);
            used.add(b);

            numbers.push(a);
            numbers.push(b);

            pairsFound++;
        }
    }


    if(pairsFound !== 12){

        return null;
    }


    shuffle(numbers);

    return numbers;
}


/* =========================================
   BUILD MAGIC SQUARE
========================================= */

function generateMagicSquare(){

    const from =
        parseInt(
            document.getElementById("rangeFrom").value
        );

    const to =
        parseInt(
            document.getElementById("rangeTo").value
        );

    const total =
        parseInt(
            document.getElementById("magicTotal").value
        );


    if(
        isNaN(from) ||
        isNaN(to) ||
        isNaN(total)
    ){

        showError("Please enter all values.");

        return;
    }


    if(from >= to){

        showError("Range From must be smaller than Range To.");

        return;
    }


    if((to-from+1) < 25){

        showError(
            "The selected range must contain at least 25 numbers."
        );

        return;
    }


    if(total % 5 !== 0){

        showError(
            "For a 5 × 5 magic square, Magic Total must be divisible by 5."
        );

        return;
    }


    let numbers = createNumbers(
        from,
        to,
        total
    );


    if(numbers === null){

        showError(
            "Could not create 25 unique numbers for this Range and Magic Total. Try another range or total."
        );

        return;
    }


    /*
       Standard 5×5 magic arrangement
    */

    let positions = createMagicPositions();


    /*
       Put random unique numbers into
       the magic positions.

       Center remains the required center value.
    */

    const center = total/5;

    let otherNumbers =
        numbers.filter(n => n !== center);

    shuffle(otherNumbers);


    let index = 0;

    let result =
        Array.from(
            {length:5},
            ()=>Array(5).fill(0)
        );


    for(let r=0;r<5;r++){

        for(let c=0;c<5;c++){

            if(positions[r][c] === 13){

                result[r][c] = center;

            }else{

                result[r][c] =
                    otherNumbers[index++];

            }
        }
    }


    /*
       The above assignment requires the numbers
       to correspond to complementary positions.

       So instead create values according to
       the magic position numbers.
    */

    const pairValues = [];


    for(let i=1;i<=12;i++){

        const a =
            otherNumbers[(i-1)*2];

        const b =
            otherNumbers[(i-1)*2+1];

        pairValues.push([a,b]);
    }


    /*
       Rebuild using symmetric cells.
    */

    result =
        Array.from(
            {length:5},
            ()=>Array(5).fill(0)
        );


    result[2][2] = center;


    const cells = [
        [0,0],[0,1],[0,2],[0,3],[0,4],
        [1,0],[1,1],[1,2],[1,3],[1,4],
        [2,0],[2,1]
    ];


    shuffle(pairValues);


    for(let i=0;i<12;i++){

        const [r,c] = cells[i];

        const rr = 4-r;
        const cc = 4-c;

        result[r][c] =
            pairValues[i][0];

        result[rr][cc] =
            pairValues[i][1];
    }


    /*
       Display
    */

    currentNumbers = result;
    currentTotal = total;

    displayGrid(result);

    checkTotals(result,total);
}


/* =========================================
   DISPLAY GRID
========================================= */

function displayGrid(square){

    for(let r=0;r<5;r++){

        for(let c=0;c<5;c++){

            const index =
                r*5+c;

            document.getElementById(
                "box"+index
            ).textContent =
                square[r][c];
        }
    }
}


/* =========================================
   CHECK TOTALS
========================================= */

function checkTotals(square,total){

    let rows = [];
    let cols = [];

    for(let r=0;r<5;r++){

        let sum = 0;

        for(let c=0;c<5;c++){

            sum += square[r][c];
        }

        rows.push(sum);
    }


    for(let c=0;c<5;c++){

        let sum = 0;

        for(let r=0;r<5;r++){

            sum += square[r][c];
        }

        cols.push(sum);
    }


    let diagonal1 = 0;
    let diagonal2 = 0;


    for(let i=0;i<5;i++){

        diagonal1 += square[i][i];

        diagonal2 += square[i][4-i];
    }


    const valid =
        rows.every(x => x === total) &&
        cols.every(x => x === total) &&
        diagonal1 === total &&
        diagonal2 === total;


    if(valid){

        document.getElementById("status").textContent =
            "✓ MAGIC SQUARE — ALL TOTALS = " + total;

    }else{

        document.getElementById("status").textContent =
            "ERROR — Magic Total not matched.";
    }


    document.getElementById("rowTotals").textContent =
        "Rows: " + rows.join(" | ");

    document.getElementById("colTotals").textContent =
        "Columns: " + cols.join(" | ") +
        " | Diagonal 1: " + diagonal1 +
        " | Diagonal 2: " + diagonal2;
}


/* =========================================
   APPLY
========================================= */

function applySettings(){

    generateMagicSquare();
}


/* =========================================
   CHANGE NUMBER ORDER
========================================= */

function changeNumberOrder(){

    if(!currentNumbers.length){

        generateMagicSquare();

        return;
    }

    /*
       Generate a completely new arrangement
       using the same inputs.
    */

    generateMagicSquare();
}


/* =========================================
   ERROR MESSAGE
========================================= */

function showError(message){

    document.getElementById("status").textContent =
        "⚠ " + message;

    document.getElementById("rowTotals").textContent = "";

    document.getElementById("colTotals").textContent = "";
}


/* =========================================
   INITIAL LOAD
========================================= */

generateMagicSquare();

</script>

</body>
</html>
