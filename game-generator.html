<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME-GENERATOR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #101522;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #f5c542;
    font-size: 25px;
}

h2 {
    text-align: center;
    font-size: 19px;
    margin: 20px 0;
}

.info {
    background: #1c2638;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #39445a;
    font-size: 14px;
}

.info-row:last-child {
    border-bottom: none;
}

.info-row span:last-child {
    color: #f5c542;
    font-weight: bold;
}

.magic-table {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
    margin: 15px 0;
}

.box {
    background: #25334b;
    border: 2px solid #435574;
    border-radius: 7px;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(17px, 5vw, 25px);
    font-weight: bold;
}

.box.selected {
    background: #f5c542;
    color: #101522;
    border-color: white;
    box-shadow: 0 0 10px #f5c542;
}

.diagonals {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 15px 0;
}

.diagonal {
    background: #1c2638;
    padding: 12px 5px;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
}

.diagonal span {
    display: inline-block;
    color: #f5c542;
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

.status {
    text-align: center;
    background: #123b2b;
    color: #45f0a5;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    margin: 12px 0;
}

.selected-box {
    background: #1c2638;
    padding: 14px;
    border-radius: 8px;
    text-align: center;
    margin: 15px 0;
}

.selected-numbers {
    color: #f5c542;
    font-size: 23px;
    font-weight: bold;
    margin-top: 10px;
    min-height: 30px;
    overflow-wrap: anywhere;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 15px 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 15px 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.next {
    background: #f5c542;
    color: #101522;
}

.save {
    background: #168b60;
    color: white;
}

.back {
    width: 100%;
    background: #39445a;
    color: white;
    margin-top: 8px;
}

.message {
    text-align: center;
    color: #45f0a5;
    font-size: 13px;
    margin: 10px 0;
}

.saved-list {
    margin-top: 20px;
    background: #1c2638;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.saved-list h3 {
    color: #f5c542;
}

.saved-item {
    border-bottom: 1px solid #39445a;
    padding: 8px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>GAME-GENERATOR</h1>

<h2>💎 DIAMOND GAME SETUP</h2>

<div class="info">

    <div class="info-row">
        <span>GAME ID</span>
        <span id="gameId">MKND840001</span>
    </div>

    <div class="info-row">
        <span>GRID</span>
        <span>5 × 5</span>
    </div>

    <div class="info-row">
        <span>NUMBERS</span>
        <span>0 – 24</span>
    </div>

    <div class="info-row">
        <span>MAGIC TOTAL</span>
        <span>60</span>
    </div>

</div>

<!-- MAGIC GRID -->

<div class="magic-table" id="magicTable"></div>

<!-- DIAGONALS -->

<div class="diagonals">

    <div class="diagonal">
        ↘ DIAGONAL 1
        <br>
        <span id="diagonal1">60</span>
    </div>

    <div class="diagonal">
        ↙ DIAGONAL 2
        <br>
        <span id="diagonal2">60</span>
    </div>

</div>

<!-- GAME STATUS -->

<div class="status" id="gameStatus">
    VALID GAME ✓
</div>

<!-- RANDOM SELECTION -->

<div class="selected-box">

    SELECTED NUMBERS

    <div id="selectedNumbers" class="selected-numbers">
        None
    </div>

</div>

<!-- BUTTONS -->

<div class="buttons">

    <button class="next" onclick="nextGame()">
        NEXT
    </button>

    <button class="save" onclick="saveGame()">
        SAVE GAME
    </button>

</div>

<div class="message" id="message"></div>

<!-- SAVED GAMES -->

<div class="saved-list">

    <h3>SAVED GAMES</h3>

    <div id="savedGames">
        No games saved
    </div>

</div>

<button class="back" onclick="history.back()">
    BACK TO ADMIN
</button>

</div>

<script>

// =================================
// GAME SETTINGS
// =================================

let gameNumber = 840001;

const MAGIC_TOTAL = 60;

let currentGrid = [];
let selectedNumbers = [];


// =================================
// SHUFFLE FUNCTION
// =================================

function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        let j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}


// =================================
// CREATE 5x5 MAGIC SQUARE
// Using Siamese method
// =================================

function createMagicSquare() {

    let size = 5;

    let square = Array.from(
        { length: size },
        () => Array(size).fill(null)
    );

    let row = 0;
    let col = Math.floor(size / 2);

    for (let num = 1; num <= 25; num++) {

        square[row][col] = num - 1;

        let nextRow = (row - 1 + size) % size;
        let nextCol = (col + 1) % size;

        if (square[nextRow][nextCol] !== null) {

            row = (row + 1) % size;

        } else {

            row = nextRow;
            col = nextCol;
        }
    }

    return square;
}


// =================================
// RANDOMIZE MAGIC SQUARE
// Valid transformations preserve
// all row/column/diagonal totals
// =================================

function randomizeMagicSquare(square) {

    let grid = square.map(row => [...row]);

    // Randomly rotate or reflect
    let rotations = Math.floor(Math.random() * 4);

    if (Math.random() < 0.5) {
        grid = grid.map(row => [...row].reverse());
    }

    for (let r = 0; r < rotations; r++) {

        let n = grid.length;

        let rotated = Array.from(
            { length: n },
            () => Array(n).fill(0)
        );

        for (let i = 0; i < n; i++) {
            for (let j = 0; j < n; j++) {

                rotated[j][n - 1 - i] = grid[i][j];
            }
        }

        grid = rotated;
    }

    // Shuffle rows inside bands
    let rowBands = shuffle([0, 1, 2]);

    let rowOrder = [];

    rowBands.forEach(band => {

        let rows = [0, 1, 2, 3, 4]
            .filter(r => Math.floor(r / 1) === band);

        if (band === 0) rows = [0, 1];
        if (band === 1) rows = [2, 3];
        if (band === 2) rows = [4];

        shuffle(rows).forEach(r => rowOrder.push(r));
    });

    // Use only transformations that preserve
    // the standard 5x5 magic square properties.
    // Randomly shuffle rows within each pair
    // and columns within each pair.

    let rowPairs = [[0,1],[2,3],[4]];
    let colPairs = [[0,1],[2,3],[4]];

    shuffle(rowPairs);
    shuffle(colPairs);

    rowPairs.forEach(pair => shuffle(pair));
    colPairs.forEach(pair => shuffle(pair));

    let rows = rowPairs.flat();
    let cols = colPairs.flat();

    let transformed = rows.map(r =>
        cols.map(c => grid[r][c])
    );

    return transformed;
}


// =================================
// CHECK MAGIC SQUARE
// =================================

function validateGrid(grid) {

    // Check every row
    for (let r = 0; r < 5; r++) {

        let total = grid[r].reduce((a, b) => a + b, 0);

        if (total !== MAGIC_TOTAL) return false;
    }

    // Check every column
    for (let c = 0; c < 5; c++) {

        let total = 0;

        for (let r = 0; r < 5; r++) {
            total += grid[r][c];
        }

        if (total !== MAGIC_TOTAL) return false;
    }

    // Check diagonals
    let d1 = 0;
    let d2 = 0;

    for (let i = 0; i < 5; i++) {

        d1 += grid[i][i];
        d2 += grid[i][4 - i];
    }

    return d1 === MAGIC_TOTAL && d2 === MAGIC_TOTAL;
}


// =================================
// DISPLAY GRID
// =================================

function displayGrid() {

    const table = document.getElementById("magicTable");

    table.innerHTML = "";

    currentGrid.flat().forEach(num => {

        let box = document.createElement("div");

        box.className = "box";
        box.textContent = num;
        box.dataset.number = num;

        if (selectedNumbers.includes(num)) {
            box.classList.add("selected");
        }

        table.appendChild(box);
    });

    document.getElementById("diagonal1").textContent =
        currentGrid.reduce((sum, row, i) => sum + row[i], 0);

    document.getElementById("diagonal2").textContent =
        currentGrid.reduce((sum, row, i) => sum + row[4 - i], 0);
}


// =================================
// AUTOMATIC RANDOM 3 NUMBER SELECT
// =================================

function selectRandomThree() {

    let allNumbers = currentGrid.flat();

    shuffle(allNumbers);

    selectedNumbers = allNumbers.slice(0, 3);

    document.getElementById("selectedNumbers").textContent =
        selectedNumbers.join("  |  ");

    displayGrid();
}


// =================================
// GENERATE NEW GAME
// =================================

function nextGame() {

    let baseSquare = createMagicSquare();

    currentGrid = randomizeMagicSquare(baseSquare);

    // Update Game ID
    gameNumber++;

    document.getElementById("gameId").textContent =
        "MKND" + gameNumber;

    // Automatically select 3 new random numbers
    selectRandomThree();

    document.getElementById("gameStatus").textContent =
        "VALID GAME ✓";

    document.getElementById("message").textContent = "";

}


// =================================
// SAVE GAME
// =================================

function saveGame() {

    let gameData = {

        gameId: document.getElementById("gameId").textContent,

        grid: currentGrid,

        selectedNumbers: selectedNumbers,

        magicTotal: MAGIC_TOTAL,

        date: new Date().toLocaleString()
    };

    let saved = JSON.parse(
        localStorage.getItem("diamondGames") || "[]"
    );

    // Prevent duplicate save for same game ID
    if (saved.some(g => g.gameId === gameData.gameId)) {

        document.getElementById("message").textContent =
            "This game is already saved!";

        return;
    }

    saved.push(gameData);

    localStorage.setItem(
        "diamondGames",
        JSON.stringify(saved)
    );

    document.getElementById("message").textContent =
        "GAME SAVED SUCCESSFULLY ✓";

    showSavedGames();
}


// =================================
// DISPLAY SAVED GAMES
// =================================

function showSavedGames() {

    let saved = JSON.parse(
        localStorage.getItem("diamondGames") || "[]"
    );

    let container = document.getElementById("savedGames");

    if (saved.length === 0) {

        container.textContent = "No games saved";
        return;
    }

    container.innerHTML = "";

    saved.forEach(game => {

        let item = document.createElement("div");

        item.className = "saved-item";

        item.textContent =
            game.gameId +
            " | Selected: " +
            game.selectedNumbers.join(", ") +
            " | " + game.date;

        container.appendChild(item);
    });
}


// =================================
// INITIAL GAME
// =================================

function initializeGame() {

    currentGrid = createMagicSquare();

    selectRandomThree();

    showSavedGames();
}

initializeGame();

</script>

</body>
</html>
