<!-- =========================
     GAME PAGE
========================= -->

<div id="gamePage" class="hidden">

  <h2 id="gameTitle">DIAMOND</h2>

  <div id="gameHint">
    Hint: each row is <span id="rowTarget">60</span>
  </div>

  <div id="gameTableHint">
    Total table is <span id="tableTarget">300</span>
  </div>

  <div id="timer">05:00</div>

  <!-- USER ANSWER SHEET -->
  <div class="answer-sheet">

    <!-- L1 label at top -->
    <div class="diagonal-top">
      L1
    </div>

    <!-- Column headings -->
    <div class="column-headings">
      <span>C1</span>
      <span>C2</span>
      <span>C3</span>
      <span>C4</span>
      <span>C5</span>
    </div>

    <div id="userGrid"></div>

    <!-- Column totals -->
    <div id="columnTotals" class="column-totals"></div>

    <!-- L2 -->
    <div class="diagonal-bottom">
      L2: <span id="l2Total">0</span>
    </div>

  </div>

  <button id="answerBtn" onclick="submitAnswer()">
    ANSWER
  </button>

</div>


<!-- =========================
     RESULT PAGE
========================= -->

<div id="resultPage" class="hidden">

  <h2>GAME RESULT</h2>

  <div id="resultMessage"></div>

  <h3>YOUR ANSWER</h3>

  <div id="yourResultGrid"></div>

  <div id="yourTotals"></div>

  <h3>OUR ANSWER</h3>

  <!-- Only boxes.
       NO totals here. -->
  <div id="ourAnswerGrid"></div>

  <h3>POINTS</h3>

  <div id="pointsBreakdown"></div>

  <div id="earnedPoints"></div>

  <button onclick="backToMenu()">
    BACK TO MENU
  </button>

</div>


<!-- =========================
     GAME CSS
========================= -->

<style>

#gamePage,
#resultPage {
  text-align: center;
  padding: 15px;
}

#gameTitle {
  margin-bottom: 8px;
}

#gameHint,
#gameTableHint {
  font-size: 18px;
  font-weight: bold;
  margin: 6px;
}

#timer {
  font-size: 32px;
  font-weight: bold;
  margin: 15px 0;
}

.answer-sheet {
  width: fit-content;
  max-width: 100%;
  margin: auto;
}

.diagonal-top,
.diagonal-bottom {
  font-weight: bold;
  margin: 8px;
}

.column-headings,
.column-totals {
  display: grid;
  grid-template-columns: repeat(5, 55px);
  gap: 4px;
  justify-content: center;
}

.column-headings span,
.column-totals span {
  font-weight: bold;
  padding: 5px;
}

#userGrid {
  display: grid;
  grid-template-columns: repeat(5, 55px);
  gap: 4px;
  justify-content: center;
}

.user-box {
  width: 55px;
  height: 55px;
  box-sizing: border-box;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border: 2px solid #333;
  border-radius: 6px;
}

.user-box:disabled {
  background: #ddd;
  color: #555;
}

.row-total {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

#yourResultGrid,
#ourAnswerGrid {
  display: grid;
  grid-template-columns: repeat(5, 55px);
  gap: 4px;
  justify-content: center;
  margin: 10px auto 20px;
}

.result-box,
.our-box {
  width: 55px;
  height: 55px;
  border: 2px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  border-radius: 6px;
}

#answerBtn,
#resultPage button {
  margin-top: 20px;
  padding: 12px 30px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#earnedPoints {
  font-size: 24px;
  font-weight: bold;
  margin: 20px;
}

@media(max-width:420px) {

  .column-headings,
  .column-totals,
  #userGrid {
    grid-template-columns: repeat(5, 48px);
  }

  .user-box {
    width: 48px;
    height: 48px;
  }

  #yourResultGrid,
  #ourAnswerGrid {
    grid-template-columns: repeat(5, 48px);
  }

  .result-box,
  .our-box {
    width: 48px;
    height: 48px;
  }
}

</style>


<script>

/* ==========================================
   CREATOR / BACKGROUND SETTINGS
========================================== */

const GAME_CONFIG = {

  DIAMOND: {
    name: "DIAMOND",
    size: 5,

    /* 5 minutes */
    duration: 300,

    /* Creator can change these */
    rowTotal: 60,
    tableTotal: 300,

    /* Points */
    rowPoints: 10,
    columnPoints: 10,
    diagonalPoints: 10,
    tablePoints: 50,

    /*
      Correct answer.

      Every row = 60
      Every column = 60
      L1 = 60
      L2 = 60
      Total table = 300
    */
    answer: [
      [16,23,0,7,14],
      [22,4,6,13,15],
      [3,5,12,19,21],
      [9,11,18,20,2],
      [10,17,24,1,8]
    ]
  },

  GOLD: {
    name: "GOLD",
    size: 3,

    duration: 60,

    rowTotal: 15,
    tableTotal: 45,

    rowPoints: 5,
    columnPoints: 5,
    diagonalPoints: 5,
    tablePoints: 25,

    answer: [
      [8,1,6],
      [3,5,7],
      [4,9,2]
    ]
  },

  SILVER: {
    name: "SILVER",
    size: 3,

    duration: 60,

    rowTotal: 15,
    tableTotal: 45,

    rowPoints: 0,
    columnPoints: 0,
    diagonalPoints: 0,
    tablePoints: 25,

    answer: [
      [6,1,8],
      [7,5,3],
      [2,9,4]
    ]
  }

};


/* ==========================================
   GAME VARIABLES
========================================== */

let currentGame = null;
let gameTimer = null;
let remainingSeconds = 0;
let gameStopped = false;


/* ==========================================
   START GAME
   IMPORTANT:
   This is called by your menu button,
   NOT shown as a START button to user.
========================================== */

function openGame(gameName) {

  currentGame = GAME_CONFIG[gameName];

  if (!currentGame) {
    alert("Game configuration not found.");
    return;
  }

  document.getElementById("gamePage")
    .classList.remove("hidden");

  document.getElementById("resultPage")
    .classList.add("hidden");

  document.getElementById("gameTitle")
    .textContent = currentGame.name;

  document.getElementById("rowTarget")
    .textContent = currentGame.rowTotal;

  document.getElementById("tableTarget")
    .textContent = currentGame.tableTotal;

  createUserGrid();

  remainingSeconds = currentGame.duration;
  gameStopped = false;

  document.getElementById("answerBtn").disabled = false;

  updateTimerDisplay();

  clearInterval(gameTimer);

  gameTimer = setInterval(function() {

    remainingSeconds--;

    updateTimerDisplay();

    if (remainingSeconds <= 0) {

      remainingSeconds = 0;

      updateTimerDisplay();

      stopGameAutomatically();

    }

  }, 1000);
}


/* ==========================================
   CREATE USER BOXES
========================================== */

function createUserGrid() {

  const grid = document.getElementById("userGrid");

  grid.innerHTML = "";

  const size = currentGame.size;

  for (let r = 0; r < size; r++) {

    for (let c = 0; c < size; c++) {

      const input = document.createElement("input");

      input.type = "number";

      input.className = "user-box";

      input.min = "0";
      input.max = "25";

      input.dataset.row = r;
      input.dataset.col = c;

      input.addEventListener("input", function() {

        if (this.value !== "") {

          let value = Number(this.value);

          if (value < 0) this.value = 0;
          if (value > 25) this.value = 25;

        }

        updateLiveTotals();

      });

      grid.appendChild(input);
    }
  }

  createRowTotals();
  createColumnTotals();

  updateLiveTotals();
}


/* ==========================================
   ROW TOTAL AREAS
========================================== */

function createRowTotals() {

  const grid = document.getElementById("userGrid");

  /*
    CSS grid is kept simple here.
    Row totals are displayed separately
    in the live totals section.
  */

  let existing = document.getElementById("rowTotals");

  if (!existing) {

    existing = document.createElement("div");

    existing.id = "rowTotals";

    existing.style.marginTop = "10px";

    document
      .querySelector(".answer-sheet")
      .appendChild(existing);
  }

  existing.innerHTML = "<b>ROW TOTALS</b><br>";

  for (let i = 0; i < currentGame.size; i++) {

    const span = document.createElement("span");

    span.id = "rowTotal" + i;

    span.style.margin = "8px";

    span.textContent = "0";

    existing.appendChild(span);
  }
}


/* ==========================================
   COLUMN TOTAL AREAS
========================================== */

function createColumnTotals() {

  const container =
    document.getElementById("columnTotals");

  container.innerHTML = "";

  for (let i = 0; i < currentGame.size; i++) {

    const span = document.createElement("span");

    span.id = "colTotal" + i;

    span.textContent = "0";

    container.appendChild(span);
  }
}


/* ==========================================
   READ USER NUMBERS
========================================== */

function getUserNumbers() {

  const inputs =
    document.querySelectorAll(".user-box");

  const size = currentGame.size;

  const numbers = [];

  let index = 0;

  for (let r = 0; r < size; r++) {

    numbers[r] = [];

    for (let c = 0; c < size; c++) {

      const value = inputs[index].value;

      numbers[r][c] =
        value === "" ? null : Number(value);

      index++;
    }
  }

  return numbers;
}


/* ==========================================
   LIVE TOTALS
========================================== */

function updateLiveTotals() {

  if (!currentGame) return;

  const numbers = getUserNumbers();

  const size = currentGame.size;

  /* Rows */

  for (let r = 0; r < size; r++) {

    let total = 0;

    for (let c = 0; c < size; c++) {

      if (numbers[r][c] !== null) {
        total += numbers[r][c];
      }
    }

    const element =
      document.getElementById("rowTotal" + r);

    if (element) {
      element.textContent = total;
    }
  }


  /* Columns */

  for (let c = 0; c < size; c++) {

    let total = 0;

    for (let r = 0; r < size; r++) {

      if (numbers[r][c] !== null) {
        total += numbers[r][c];
      }
    }

    const element =
      document.getElementById("colTotal" + c);

    if (element) {
      element.textContent = total;
    }
  }


  /* L1 */

  let l1 = 0;

  for (let i = 0; i < size; i++) {

    if (numbers[i][i] !== null) {
      l1 += numbers[i][i];
    }
  }


  /* L2 */

  let l2 = 0;

  for (let i = 0; i < size; i++) {

    const value =
      numbers[i][size - 1 - i];

    if (value !== null) {
      l2 += value;
    }
  }

  document.getElementById("l2Total")
    .textContent = l2;

  /*
    L1 can be displayed separately later
    beside the top of the answer sheet.
  */
}


/* ==========================================
   TIMER
========================================== */

function updateTimerDisplay() {

  const minutes =
    Math.floor(remainingSeconds / 60);

  const seconds =
    remainingSeconds % 60;

  document.getElementById("timer")
    .textContent =
      String(minutes).padStart(2, "0")
      + ":"
      + String(seconds).padStart(2, "0");
}


/* ==========================================
   AUTOMATIC STOP
========================================== */

function stopGameAutomatically() {

  if (gameStopped) return;

  gameStopped = true;

  clearInterval(gameTimer);

  /*
    LOCK ALL BOXES
  */

  document
    .querySelectorAll(".user-box")
    .forEach(function(box) {

      box.disabled = true;

    });

}


/* ==========================================
   ANSWER BUTTON
========================================== */

function submitAnswer() {

  /*
    User tries before zero
  */

  if (!gameStopped) {

    alert("Game is still running");

    return;
  }


  const numbers = getUserNumbers();

  const size = currentGame.size;

  /*
    Make sure every box has a number
  */

  for (let r = 0; r < size; r++) {

    for (let c = 0; c < size; c++) {

      if (numbers[r][c] === null) {

        alert(
          "Please fill all boxes before submitting."
        );

        return;
      }
    }
  }


  /*
    Open separate Result Page
  */

  showResultPage(numbers);
}


/* ==========================================
   RESULT PAGE
========================================== */

function showResultPage(userNumbers) {

  document
    .getElementById("gamePage")
    .classList.add("hidden");

  document
    .getElementById("resultPage")
    .classList.remove("hidden");


  const size = currentGame.size;

  const answer = currentGame.answer;


  /* ======================================
     USER ANSWER BOXES
  ====================================== */

  const userGrid =
    document.getElementById("yourResultGrid");

  userGrid.innerHTML = "";

  for (let r = 0; r < size; r++) {

    for (let c = 0; c < size; c++) {

      const box =
        document.createElement("div");

      box.className = "result-box";

      box.textContent =
        userNumbers[r][c];

      userGrid.appendChild(box);
    }
  }


  /* ======================================
     OUR ANSWER BOXES
     NO TOTALS HERE
  ====================================== */

  const ourGrid =
    document.getElementById("ourAnswerGrid");

  ourGrid.innerHTML = "";

  for (let r = 0; r < size; r++) {

    for (let c = 0; c < size; c++) {

      const box =
        document.createElement("div");

      box.className = "our-box";

      box.textContent =
        answer[r][c];

      ourGrid.appendChild(box);
    }
  }


  calculateScore(userNumbers);
}


/* ==========================================
   SCORE CALCULATION
========================================== */

function calculateScore(numbers) {

  const size = currentGame.size;

  const target = currentGame.rowTotal;

  const tableTarget =
    currentGame.tableTotal;

  const answer =
    currentGame.answer;


  let totalPoints = 0;

  let html = "";


  /* ======================================
     ROWS
  ====================================== */

  for (let r = 0; r < size; r++) {

    let total = 0;

    for (let c = 0; c < size; c++) {

      total += numbers[r][c];

    }

    const correct =
      total === target;

    if (correct) {

      totalPoints += currentGame.rowPoints;

    }

    html +=
      "Row " + (r + 1)
      + ": "
      + total
      + " / "
      + target
      + " → "
      + (correct
          ? currentGame.rowPoints + " points"
          : "0 points")
      + "<br>";
  }


  /* ======================================
     COLUMNS
  ====================================== */

  for (let c = 0; c < size; c++) {

    let total = 0;

    for (let r = 0; r < size; r++) {

      total += numbers[r][c];

    }

    const correct =
      total === target;

    if (correct) {

      totalPoints += currentGame.columnPoints;

    }

    html +=
      "Column " + (c + 1)
      + ": "
      + total
      + " / "
      + target
      + " → "
      + (correct
          ? currentGame.columnPoints + " points"
          : "0 points")
      + "<br>";
  }


  /* ======================================
     L1
  ====================================== */

  let l1 = 0;

  for (let i = 0; i < size; i++) {

    l1 += numbers[i][i];

  }

  const l1Correct =
    l1 === target;

  if (l1Correct) {

    totalPoints +=
      currentGame.diagonalPoints;

  }

  html +=
    "L1: "
    + l1
    + " / "
    + target
    + " → "
    + (l1Correct
        ? currentGame.diagonalPoints
          + " points"
        : "0 points")
    + "<br>";


  /* ======================================
     L2
  ====================================== */

  let l2 = 0;

  for (let i = 0; i < size; i++) {

    l2 +=
      numbers[i][size - 1 - i];

  }

  const l2Correct =
    l2 === target;

  if (l2Correct) {

    totalPoints +=
      currentGame.diagonalPoints;

  }

  html +=
    "L2: "
    + l2
    + " / "
    + target
    + " → "
    + (l2Correct
        ? currentGame.diagonalPoints
          + " points"
        : "0 points")
    + "<br>";


  /* ======================================
     TOTAL TABLE
  ====================================== */

  let tableTotal = 0;

  for (let r = 0; r < size; r++) {

    for (let c = 0; c < size; c++) {

      tableTotal += numbers[r][c];

    }
  }

  const tableCorrect =
    tableTotal === tableTarget;

  if (tableCorrect) {

    totalPoints += currentGame.tablePoints;

  }

  html +=
    "<br><b>Total Table: "
    + tableTotal
    + " / "
    + tableTarget
    + " → "
    + (tableCorrect
        ? currentGame.tablePoints
          + " points"
        : "0 points")
    + "</b>";


  /* ======================================
     RESULT MESSAGE
  ====================================== */

  const maxPoints =
    (size * currentGame.rowPoints)
    +
    (size * currentGame.columnPoints)
    +
    (2 * currentGame.diagonalPoints)
    +
    currentGame.tablePoints;


  document.getElementById("pointsBreakdown")
    .innerHTML = html;


  document.getElementById("earnedPoints")
    .textContent =
      "EARNED: "
      + totalPoints
      + " / "
      + maxPoints
      + " POINTS";


  document.getElementById("resultMessage")
    .textContent =
      totalPoints > 0
        ? "GAME RESULT"
        : "BETTER LUCK NEXT TIME";


  /*
    Save score to Firebase later
    after connecting this function to
    your existing currentUserData.
  */

}


/* ==========================================
   BACK TO MENU
========================================== */

function backToMenu() {

  clearInterval(gameTimer);

  document
    .getElementById("resultPage")
    .classList.add("hidden");

  /*
    Replace this with your existing
    menu/showMenu() function.
  */

  document
    .getElementById("gamePage")
    .classList.add("hidden");

}


/* ==========================================
   EXAMPLE MENU CONNECTION
==========================================

   Your existing buttons should call:

   openGame("DIAMOND");
   openGame("GOLD");
   openGame("SILVER");

   There is NO START button for the user.
========================================== */

</script>
