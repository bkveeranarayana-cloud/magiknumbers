<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAGIKNUMBER Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

/* HEADER */

.header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

.header h2{
  margin:0;
  font-size:21px;
}

/* DASHBOARD */

.dashboard{
  width:94%;
  max-width:900px;
  margin:auto;
  padding:20px 0 40px;
}

/* FRAMES */

.frames{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.frame{
  background:white;
  border:2px solid #e2e8f0;
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.frameTitle{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:2px solid #e5e7eb;
}

/* REGISTRATION */

.registration{
  border-color:#2563eb;
}

.registration .frameTitle{
  color:#2563eb;
}

/* DELETION */

.deletion{
  border-color:#dc2626;
}

.deletion .frameTitle{
  color:#dc2626;
}

/* STAT ROW */

.statRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 4px;
  border-bottom:1px solid #e5e7eb;
}

.statRow:last-child{
  border-bottom:0;
}

.statName{
  font-size:14px;
  font-weight:bold;
  color:#475569;
}

.statValue{
  font-size:21px;
  font-weight:bold;
  color:#111827;
}

/* CHANGE */

.change{
  display:block;
  font-size:12px;
  margin-top:3px;
  font-weight:bold;
}

.up{
  color:#16a34a;
}

.down{
  color:#dc2626;
}

.noChange{
  color:#64748b;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  color:#64748b;
}

/* BACK */

.backBtn{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#64748b;
  color:white;
  font-size:16px;
  font-weight:bold;
}

/* MOBILE */

@media(max-width:650px){

  .frames{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="header">
  <h2>MAGIKNUMBER ADMIN</h2>
</div>

<div class="dashboard">

  <div id="loading" class="loading">
    Loading dashboard...
  </div>

  <div id="dashboardContent" style="display:none;">

    <div class="frames">

      <!-- REGISTRATION FRAME -->

      <div class="frame registration">

        <div class="frameTitle">
          REGISTRATION
        </div>

        <div class="statRow">

          <div class="statName">
            TOTAL REGISTERED
          </div>

          <div class="statValue" id="totalRegistered">
            0
          </div>

        </div>


        <div class="statRow">

          <div class="statName">
            TODAY REGISTERED
          </div>

          <div>

            <div class="statValue" id="todayRegistered">
              0
            </div>

            <span
              class="change"
              id="todayChange">
            </span>

          </div>

        </div>


        <div class="statRow">

          <div class="statName">
            LAST 7 DAYS
          </div>

          <div>

            <div class="statValue" id="sevenDaysRegistered">
              0
            </div>

            <span
              class="change"
              id="sevenDaysChange">
            </span>

          </div>

        </div>


        <div class="statRow">

          <div class="statName">
            LAST 30 DAYS
          </div>

          <div>

            <div class="statValue" id="thirtyDaysRegistered">
              0
            </div>

            <span
              class="change"
              id="thirtyDaysChange">
            </span>

          </div>

        </div>

      </div>


      <!-- DELETION FRAME -->

      <div class="frame deletion">

        <div class="frameTitle">
          ACCOUNT DELETION
        </div>

        <div class="statRow">

          <div class="statName">
            TOTAL DELETED
          </div>

          <div class="statValue" id="totalDeleted">
            0
          </div>

        </div>


        <div class="statRow">

          <div class="statName">
            TODAY DELETED
          </div>

          <div class="statValue" id="todayDeleted">
            0
          </div>

        </div>


        <div class="statRow">

          <div class="statName">
            LAST 7 DAYS DELETED
          </div>

          <div class="statValue" id="sevenDaysDeleted">
            0
          </div>

        </div>


        <div class="statRow">

          <div class="statName">
            LAST 30 DAYS DELETED
          </div>

          <div class="statValue" id="thirtyDaysDeleted">
            0
          </div>

        </div>

      </div>

    </div>

    <button
      class="backBtn"
      onclick="location.href='admin.html'">
      BACK TO ADMIN
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getFirestore,
  collection,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyCX8mVCrI-qm4_7uADo_Y41hpvg1OrLlVI",

  authDomain:
  "magiknumbers-d42c0.firebaseapp.com",

  projectId:
  "magiknumbers-d42c0",

  storageBucket:
  "magiknumbers-d42c0.firebasestorage.app",

  messagingSenderId:
  "977553928698",

  appId:
  "1:977553928698:web:0c9c5c59fe5b6a9ef5b443"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);


/* DATE HELPERS */

function getDate(value){

  if(!value){
    return null;
  }

  try{

    if(value.toDate){
      return value.toDate();
    }

    const date =
      new Date(value);

    if(isNaN(date.getTime())){
      return null;
    }

    return date;

  }
  catch(error){

    return null;

  }

}


function startOfDay(date){

  const d =
    new Date(date);

  d.setHours(0,0,0,0);

  return d;

}


/* COUNT USERS */

function countBetween(users, start, end){

  let count = 0;

  users.forEach(user => {

    const date =
      getDate(user.dateOfJoining);

    if(!date){
      return;
    }

    if(date >= start && date < end){
      count++;
    }

  });

  return count;

}


/* PERCENT CHANGE */

function percentageChange(current, previous){

  if(previous === 0){

    if(current === 0){
      return 0;
    }

    return null;

  }

  return Math.round(
    ((current - previous) / previous) * 100
  );

}


/* SHOW CHANGE */

function showChange(elementId, current, previous){

  const element =
    document.getElementById(elementId);

  const change =
    percentageChange(
      current,
      previous
    );

  if(change === null){

    element.textContent =
      current > 0
      ? "New"
      : "0%";

    element.className =
      "change noChange";

    return;

  }

  if(change > 0){

    element.textContent =
      "▲ " + change + "%";

    element.className =
      "change up";

  }
  else if(change < 0){

    element.textContent =
      "▼ " + Math.abs(change) + "%";

    element.className =
      "change down";

  }
  else{

    element.textContent =
      "0%";

    element.className =
      "change noChange";

  }

}


/* LOAD DASHBOARD */

async function loadDashboard(){

  try{

    /* USERS */

    const usersSnapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );

    const users = [];

    usersSnapshot.forEach(doc => {

      users.push(
        doc.data()
      );

    });


    const now =
      new Date();

    const todayStart =
      startOfDay(now);

    const tomorrowStart =
      new Date(todayStart);

    tomorrowStart.setDate(
      tomorrowStart.getDate() + 1
    );


    /* TODAY */

    const yesterdayStart =
      new Date(todayStart);

    yesterdayStart.setDate(
      yesterdayStart.getDate() - 1
    );


    /* 7 DAYS */

    const sevenStart =
      new Date(todayStart);

    sevenStart.setDate(
      sevenStart.getDate() - 6
    );

    const previousSevenStart =
      new Date(todayStart);

    previousSevenStart.setDate(
      previousSevenStart.getDate() - 13
    );


    /* 30 DAYS */

    const thirtyStart =
      new Date(todayStart);

    thirtyStart.setDate(
      thirtyStart.getDate() - 29
    );

    const previousThirtyStart =
      new Date(todayStart);

    previousThirtyStart.setDate(
      previousThirtyStart.getDate() - 59
    );


    /* REGISTRATION COUNTS */

    const totalRegistered =
      users.length;


    const todayRegistered =
      countBetween(
        users,
        todayStart,
        tomorrowStart
      );


    const yesterdayRegistered =
      countBetween(
        users,
        yesterdayStart,
        todayStart
      );


    const sevenDaysRegistered =
      countBetween(
        users,
        sevenStart,
        tomorrowStart
      );


    const previousSevenRegistered =
      countBetween(
        users,
        previousSevenStart,
        sevenStart
      );


    const thirtyDaysRegistered =
      countBetween(
        users,
        thirtyStart,
        tomorrowStart
      );


    const previousThirtyRegistered =
      countBetween(
        users,
        previousThirtyStart,
        thirtyStart
      );


    /* DISPLAY REGISTRATION */

    document.getElementById(
      "totalRegistered"
    ).textContent =
      totalRegistered;


    document.getElementById(
      "todayRegistered"
    ).textContent =
      todayRegistered;


    document.getElementById(
      "sevenDaysRegistered"
    ).textContent =
      sevenDaysRegistered;


    document.getElementById(
      "thirtyDaysRegistered"
    ).textContent =
      thirtyDaysRegistered;


    /* REGISTRATION % */

    showChange(
      "todayChange",
      todayRegistered,
      yesterdayRegistered
    );


    showChange(
      "sevenDaysChange",
      sevenDaysRegistered,
      previousSevenRegistered
    );


    showChange(
      "thirtyDaysChange",
      thirtyDaysRegistered,
      previousThirtyRegistered
    );


    /* DELETED ACCOUNTS */

    let deleted = [];

    try{

      const deletedSnapshot =
        await getDocs(
          collection(
            db,
            "accountDeletions"
          )
        );

      deletedSnapshot.forEach(doc => {

        deleted.push(
          doc.data()
        );

      });

    }
    catch(error){

      console.log(
        "accountDeletions collection not available yet."
      );

    }


    const totalDeleted =
      deleted.length;


    const todayDeleted =
      countBetween(
        deleted,
        todayStart,
        tomorrowStart
      );


    const sevenDaysDeleted =
      countBetween(
        deleted,
        sevenStart,
        tomorrowStart
      );


    const thirtyDaysDeleted =
      countBetween(
        deleted,
        thirtyStart,
        tomorrowStart
      );


    /* DISPLAY DELETION */

    document.getElementById(
      "totalDeleted"
    ).textContent =
      totalDeleted;


    document.getElementById(
      "todayDeleted"
    ).textContent =
      todayDeleted;


    document.getElementById(
      "sevenDaysDeleted"
    ).textContent =
      sevenDaysDeleted;


    document.getElementById(
      "thirtyDaysDeleted"
    ).textContent =
      thirtyDaysDeleted;


    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "dashboardContent"
    ).style.display =
      "block";

  }
  catch(error){

    console.error(error);

    document.getElementById(
      "loading"
    ).textContent =
      "Unable to load dashboard.";

  }

}


loadDashboard();

</script>

</body>
</html>
