<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME GENERATOR</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:17px 10px;
    font-size:23px;
    font-weight:bold;
}

.container{
    max-width:520px;
    margin:15px auto;
    padding:10px;
}

.card{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    margin:5px 0 15px;
    font-size:21px;
}

.game-info{
    background:#eef2ff;
    border-radius:10px;
    padding:11px;
    margin-bottom:15px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:8px 0;
    font-weight:bold;
}

.info-row span:first-child{
    white-space:nowrap;
}

.game-input,
.game-select{
    width:170px;
    padding:9px;
    border:2px solid #2563eb;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    background:white;
}

.apply-btn{
    width:100%;
    margin-top:12px;
    background:#7c3aed;
    color:white;
    border:0;
    padding:13px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.magic-area{
    width:100%;
    overflow-x:auto;
    padding:5px 0;
}

.magic-table{
    display:grid;

    grid-template-columns:
        48px
        repeat(5,1fr);

    grid-template-rows:
        42px
        repeat(5,1fr);

    gap:5px;

    width:100%;
    max-width:450px;

    margin:auto;
}

.corner{
    background:transparent;
}

.column-total{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#dbeafe;
    color:#1d4ed8;

    border-radius:8px;

    font-size:15px;
    font-weight:bold;
}

.row-total{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#dcfce7;
    color:#15803d;

    border-radius:8px;

    font-size:15px;
    font-weight:bold;
}

.box{
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;

    border:2px solid #2563eb;

    border-radius:8px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
    user-select:none;

    transition:.15s;
}

.box.selected{
    background:#facc15;
    border-color:#ca8a04;
    color:#111827;

    transform:scale(.94);
}

.diagonal-area{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.diagonal{
    flex:1;
    background:#f3e8ff;
    color:#7e22ce;
    border-radius:9px;
    padding:10px 5px;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.status{
    margin-top:12px;
    padding:11px;
    border-radius:9px;
    text-align:center;
    background:#ecfdf5;
    color:#166534;
    font-weight:bold;
}

.selected-info{
    margin-top:12px;

    background:#fff7ed;

    border:1px solid #fed7aa;

    border-radius:9px;

    padding:11px;

    text-align:center;

    font-weight:bold;
}

.selected-numbers{
    margin-top:6px;
    font-size:18px;
    color:#ea580c;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    border:0;
    padding:14px 8px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.next{
    background:#2563eb;
    color:white;
}

.save{
    background:#16a34a;
    color:white;
}

.back{
    width:100%;
    margin-top:10px;
    background:#6b7280;
    color:white;
}

.saved{
    text-align:center;
    margin-top:13px;
    font-weight:bold;
    color:#15803d;
}

@media(max-width:380px){

    .magic-table{
        grid-template-columns:
            42px
            repeat(5,1fr);

        gap:4px;
    }

    .box{
        font-size:17px;
    }

    .column-total,
    .row-total{
        font-size:13px;
    }

    .game-input,
    .game-select{
        width:145px;
    }
}

</style>
</head>

<body>

<div class="header">
    GAME-GENERATOR
</div>

<div class="container">

<div class="card">

<h2>DIAMOND GAME SETUP</h2>

<div class="game-info">

    <div class="info-row">
        <span>GAME ID</span>

        <select id="gameIdSelect" class="game-select">
        </select>
    </div>

    <div class="info-row">
        <span>GRID</span>
        <span>5 × 5</span>
    </div>

    <div class="info-row">
        <span>NUMBERS</span>
        <span>0 – 24</span>
    </div>

    <div class="info-row">
        <span>MAGIC TOTAL</span>

        <input
            type="number"
            id="magicTotalInput"
            class="game-input"
            value="60"
            min="1"
        >
    </div>

    <button
        class="apply-btn"
        onclick="applySettings()">
        APPLY
    </button>

</div>


<div class="magic-area">

    <div
        class="magic-table"
        id="magicTable">
    </div>

</div>


<div class="diagonal-area">

    <div class="diagonal">
        ↘ DIAGONAL 1
        <br>
        <span id="diagonal1">60</span>
    </div>

    <div class="diagonal">
        ↙ DIAGONAL 2
        <br>
        <span id="diagonal2">60</span>
    </div>

</div>


<div id="status" class="status">
    VALID GAME ✓
</div>


<div class="selected-info">

    SELECTED NUMBERS

    <div
        id="selectedNumbers"
        class="selected-numbers">
        None
    </div>

</div>


<div class="buttons">

    <button
        class="next"
        onclick="nextGame()">
        NEXT
    </button>

    <button
        class="save"
        onclick="saveGame()">
        SAVE GAME
    </button>

</div>


<button
    class="back"
    onclick="goBack()">
    BACK TO ADMIN
</button>


<div
    id="savedMessage"
    class="saved">
</div>

</div>
</div>


<script>

/* ==========================================
   BASE 5 × 5 MAGIC SQUARE
   NUMBERS 0 - 24
   MAGIC TOTAL = 60
========================================== */

const baseSquare = [

    [16,23,0,7,14],

    [22,4,6,13,15],

    [3,5,12,19,21],

    [9,11,18,20,2],

    [10,17,24,1,8]

];


/* ==========================================
   GAME SETTINGS
========================================== */

let currentNumber = 1;

let currentSquare = [];

let selectedCells = [];

let magicTotal = 60;


/* ==========================================
   CREATE GAME ID DROPDOWN
========================================== */

function createGameIds(){

    const select =
        document.getElementById(
            "gameIdSelect"
        );

    select.innerHTML = "";

    for(let i=1;i<=250;i++){

        const option =
            document.createElement("option");

        option.value =
            "MKND84" +
            String(i).padStart(4,"0");

        option.textContent =
            option.value;

        select.appendChild(option);

    }

}


/* ==========================================
   COPY
========================================== */

function copySquare(square){

    return square.map(
        row => [...row]
    );

}


/* ==========================================
   ROTATE
========================================== */

function rotate90(square){

    const n = square.length;

    const result =
        Array.from(
            {length:n},
            () => Array(n).fill(0)
        );

    for(let r=0;r<n;r++){

        for(let c=0;c<n;c++){

            result[c][n-1-r] =
                square[r][c];

        }

    }

    return result;

}


/* ==========================================
   FLIP HORIZONTAL
========================================== */

function flipHorizontal(square){

    return square.map(
        row => [...row].reverse()
    );

}


/* ==========================================
   FLIP VERTICAL
========================================== */

function flipVertical(square){

    return [
        ...square
    ].reverse()
    .map(
        row => [...row]
    );

}


/* ==========================================
   GENERATE
========================================== */

function generateSquare(){

    let square =
        copySquare(baseSquare);

    const random =
        Math.floor(Math.random()*8);

    switch(random){

        case 0:
            break;

        case 1:
            square =
                rotate90(square);
            break;

        case 2:
            square =
                rotate90(
                    rotate90(square)
                );
            break;

        case 3:
            square =
                rotate90(
                    rotate90(
                        rotate90(square)
                    )
                );
            break;

        case 4:
            square =
                flipHorizontal(square);
            break;

        case 5:
            square =
                flipVertical(square);
            break;

        case 6:
            square =
                flipHorizontal(
                    rotate90(square)
                );
            break;

        case 7:
            square =
                flipVertical(
                    rotate90(square)
                );
            break;
    }

    return square;

}


/* ==========================================
   ROW TOTAL
========================================== */

function getRowTotal(row){

    return row.reduce(
        (sum,n) => sum+n,
        0
    );

}


/* ==========================================
   COLUMN TOTAL
========================================== */

function getColumnTotal(column){

    let total = 0;

    for(let r=0;r<5;r++){

        total +=
            currentSquare[r][column];

    }

    return total;

}


/* ==========================================
   DIAGONALS
========================================== */

function getDiagonal1(){

    let total = 0;

    for(let i=0;i<5;i++){

        total +=
            currentSquare[i][i];

    }

    return total;

}


function getDiagonal2(){

    let total = 0;

    for(let i=0;i<5;i++){

        total +=
            currentSquare[i][4-i];

    }

    return total;

}


/* ==========================================
   DISPLAY
========================================== */

function displayGame(){

    const table =
        document.getElementById(
            "magicTable"
        );

    table.innerHTML = "";


    const corner =
        document.createElement("div");

    corner.className =
        "corner";

    table.appendChild(corner);


    for(let c=0;c<5;c++){

        const total =
            document.createElement("div");

        total.className =
            "column-total";

        total.textContent =
            getColumnTotal(c);

        table.appendChild(total);

    }


    for(let r=0;r<5;r++){

        const rowTotal =
            document.createElement("div");

        rowTotal.className =
            "row-total";

        rowTotal.textContent =
            getRowTotal(
                currentSquare[r]
            );

        table.appendChild(rowTotal);


        for(let c=0;c<5;c++){

            const box =
                document.createElement("div");

            box.className =
                "box";

            box.textContent =
                currentSquare[r][c];


            const alreadySelected =
                selectedCells.some(
                    item =>
                        item.row === r &&
                        item.col === c
                );


            if(alreadySelected){

                box.classList.add(
                    "selected"
                );

            }


            box.onclick =
                function(){

                    selectCell(
                        r,
                        c,
                        box
                    );

                };


            table.appendChild(box);

        }

    }


    document.getElementById(
        "diagonal1"
    ).textContent =
        getDiagonal1();


    document.getElementById(
        "diagonal2"
    ).textContent =
        getDiagonal2();


    updateSelectedDisplay();

}


/* ==========================================
   SELECT 3 BOXES
========================================== */

function selectCell(row,col,box){

    const index =
        selectedCells.findIndex(
            item =>
                item.row === row &&
                item.col === col
        );


    if(index !== -1){

        selectedCells.splice(
            index,
            1
        );

        box.classList.remove(
            "selected"
        );

        updateSelectedDisplay();

        return;

    }


    if(selectedCells.length >= 3){

        alert(
            "You can select only 3 numbers."
        );

        return;

    }


    selectedCells.push({

        row:row,

        col:col,

        number:
            currentSquare[row][col]

    });


    box.classList.add(
        "selected"
    );


    updateSelectedDisplay();

}


/* ==========================================
   SELECTED DISPLAY
========================================== */

function updateSelectedDisplay(){

    const element =
        document.getElementById(
            "selectedNumbers"
        );


    if(selectedCells.length === 0){

        element.textContent =
            "None";

        return;

    }


    element.textContent =
        selectedCells
        .map(item => item.number)
        .join("   •   ");

}


/* ==========================================
   APPLY SETTINGS
========================================== */

function applySettings(){

    const selectedGameId =
        document.getElementById(
            "gameIdSelect"
        ).value;


    const input =
        document.getElementById(
            "magicTotalInput"
        ).value;


    const total =
        Number(input);


    if(!total || total < 1){

        alert(
            "Please enter a valid Magic Total."
        );

        return;

    }


    /*
       With numbers 0-24 used once,
       5x5 magic total must be 60.
    */

    if(total !== 60){

        alert(
            "With numbers 0-24 used once in a 5×5 magic square, Magic Total must be 60."
        );

        return;

    }


    magicTotal =
        total;


    currentNumber =
        Number(
            selectedGameId
            .replace("MKND84","")
        );


    currentSquare =
        generateSquare();


    selectedCells = [];


    /*
       Save configuration
    */

    const config = {

        gameId:selectedGameId,

        gameType:"DIAMOND",

        gridSize:5,

        numbers:currentSquare,

        magicTotal:magicTotal,

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(

        "DIAMOND_GAME_" +
        selectedGameId,

        JSON.stringify(config)

    );


    /*
       Also remember currently
       applied game
    */

    localStorage.setItem(

        "ACTIVE_DIAMOND_GAME",

        selectedGameId

    );


    displayGame();


    document.getElementById(
        "savedMessage"
    ).textContent =
        selectedGameId +
        " APPLIED ✓";

}


/* ==========================================
   NEXT
========================================== */

function nextGame(){

    currentNumber++;

    if(currentNumber > 250){

        currentNumber = 1;

    }


    document.getElementById(
        "gameIdSelect"
    ).value =
        "MKND84" +
        String(currentNumber)
            .padStart(4,"0");


    currentSquare =
        generateSquare();

    selectedCells = [];


    displayGame();

    document.getElementById(
        "savedMessage"
    ).textContent = "";

}


/* ==========================================
   VALIDATE
========================================== */

function validateSquare(square){

    const numbers = [];


    for(let r=0;r<5;r++){

        for(let c=0;c<5;c++){

            numbers.push(
                square[r][c]
            );

        }

    }


    if(
        new Set(numbers).size !== 25
    ){

        return false;

    }


    for(let n=0;n<=24;n++){

        if(!numbers.includes(n)){

            return false;

        }

    }


    for(let r=0;r<5;r++){

        if(
            getRowTotal(square[r]) !==
            magicTotal
        ){

            return false;

        }

    }


    for(let c=0;c<5;c++){

        let total = 0;

        for(let r=0;r<5;r++){

            total +=
                square[r][c];

        }

        if(total !== magicTotal){

            return false;

        }

    }


    let d1 = 0;

    for(let i=0;i<5;i++){

        d1 +=
            square[i][i];

    }


    if(d1 !== magicTotal){

        return false;

    }


    let d2 = 0;

    for(let i=0;i<5;i++){

        d2 +=
            square[i][4-i];

    }


    if(d2 !== magicTotal){

        return false;

    }


    return true;

}


/* ==========================================
   SAVE GAME
========================================== */

function saveGame(){

    if(selectedCells.length !== 3){

        alert(
            "Please select exactly 3 numbers before saving."
        );

        return;

    }


    if(!validateSquare(currentSquare)){

        alert(
            "Game is invalid."
        );

        return;

    }


    const gameId =
        document.getElementById(
            "gameIdSelect"
        ).value;


    const gameData = {

        gameId:gameId,

        gameType:"DIAMOND",

        gridSize:5,

        numbers:currentSquare,

        magicTotal:magicTotal,

        selectedNumbers:
            selectedCells.map(
                item => item.number
            ),

        selectedPositions:
            selectedCells.map(
                item => ({

                    row:item.row,

                    column:item.col,

                    number:item.number

                })
            ),

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(

        "DIAMOND_GAME_" + gameId,

        JSON.stringify(gameData)

    );


    localStorage.setItem(

        "ACTIVE_DIAMOND_GAME",

        gameId

    );


    document.getElementById(
        "savedMessage"
    ).textContent =
        gameId +
        " SAVED ✓";

}


/* ==========================================
   BACK
========================================== */

function goBack(){

    window.location.href =
        "admin.html";

}


/* ==========================================
   START
========================================== */

createGameIds();

currentSquare =
    generateSquare();

displayGame();

</script>

</body>
</html>
