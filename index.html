<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc
}
from
"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCX8mVCrI-qm4_7uADo_Y41hpvg1OrLlVI",

  authDomain:
    "magiknumbers-d42c0.firebaseapp.com",

  projectId:
    "magiknumbers-d42c0",

  storageBucket:
    "magiknumbers-d42c0.firebasestorage.app",

  messagingSenderId:
    "977553928698",

  appId:
    "1:977553928698:web:0c9c5c59fe5b6a9ef5b443"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const googleProvider = new GoogleAuthProvider();


/* =========================================
   TEMPORARY REGISTRATION DETAILS
   ========================================= */

let pendingRegistration = null;


/* =========================================
   CREATE / UPDATE PROFILE
   ========================================= */

async function createUserProfile(
  user,
  registerName = "",
  registerMobile = ""
) {

  const userRef =
    doc(db, "users", user.uid);

  const existing =
    await getDoc(userRef);


  /* =========================================
     EXISTING USER
     ========================================= */

  if (existing.exists()) {

    const data = existing.data();

    const updates = {};


    /* JOINING DATE */

    if (!data.joiningDate) {

      let joiningDate;

      if (
        user.metadata &&
        user.metadata.creationTime
      ) {

        joiningDate =
          new Date(
            user.metadata.creationTime
          ).toLocaleDateString("en-IN");

      } else {

        joiningDate =
          new Date()
          .toLocaleDateString("en-IN");

      }

      updates.joiningDate =
        joiningDate;
    }


    /* GAMES PLAYED */

    if (data.gamesPlayed === undefined) {

      updates.gamesPlayed = 0;

    }


    /* CASH BALANCE */

    if (data.cashBalance === undefined) {

      updates.cashBalance = 0;

    }


    /*
      IMPORTANT:
      If existing name is "User" and we have
      a real registration name, replace it.
    */

    if (
      (data.name === "User" ||
       data.name === "user" ||
       !data.name) &&
      registerName
    ) {

      updates.name =
        registerName;

    }


    /* MOBILE */

    if (
      (!data.mobile ||
       data.mobile === "") &&
      registerMobile
    ) {

      updates.mobile =
        registerMobile;

    }


    /* SAVE */

    if (
      Object.keys(updates).length > 0
    ) {

      await updateDoc(
        userRef,
        updates
      );

      const updated =
        await getDoc(userRef);

      return updated.data();

    }

    return data;

  }


  /* =========================================
     NEW USER
     ========================================= */

  const joiningDate =
    new Date()
    .toLocaleDateString("en-IN");


  /*
    IMPORTANT:
    Registration name has priority.
  */

  const finalName =
    registerName.trim();


  const finalMobile =
    registerMobile.trim();


  const userData = {

    magikNumberId:
      "MN100001",

    name:
      finalName,

    email:
      user.email || "",

    mobile:
      finalMobile,

    joiningDate:
      joiningDate,

    gamesPlayed:
      0,

    points:
      0,

    cashBalance:
      0
  };


  await setDoc(
    userRef,
    userData
  );


  return userData;

}


/* =========================================
   REGISTER
   ========================================= */

window.registerUser =
async function() {

  const name =
    document
    .getElementById("name")
    .value
    .trim();

  const mobile =
    document
    .getElementById("mobile")
    .value
    .trim();

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;


  if (!name) {

    showMessage(
      "Please enter your name."
    );

    return;

  }


  if (!mobile) {

    showMessage(
      "Please enter your mobile number."
    );

    return;

  }


  if (!email) {

    showMessage(
      "Please enter your email."
    );

    return;

  }


  if (!password) {

    showMessage(
      "Please enter your password."
    );

    return;

  }


  try {

    showMessage(
      "Creating account..."
    );


    /*
      IMPORTANT:
      Save registration details BEFORE
      creating Firebase account.
    */

    pendingRegistration = {

      name: name,

      mobile: mobile

    };


    await
    createUserWithEmailAndPassword(
      auth,
      email,
      password
    );


    /*
      Profile will be created by
      onAuthStateChanged.
    */

  }

  catch (error) {

    pendingRegistration = null;

    showFirebaseError(error);

  }

};


/* =========================================
   LOGIN
   ========================================= */

window.loginUser =
async function() {

  const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();

  const password =
    document
    .getElementById("loginPassword")
    .value;


  if (!email || !password) {

    showMessage(
      "Enter email and password."
    );

    return;

  }


  try {

    showMessage(
      "Logging in..."
    );


    await
    signInWithEmailAndPassword(
      auth,
      email,
      password
    );


    showMessage("");

  }

  catch (error) {

    showFirebaseError(error);

  }

};


/* =========================================
   GOOGLE LOGIN
   ========================================= */

window.googleLogin =
async function() {

  try {

    showMessage(
      "Opening Google login..."
    );


    await
    signInWithPopup(
      auth,
      googleProvider
    );


    showMessage("");

  }

  catch (error) {

    showFirebaseError(error);

  }

};


/* =========================================
   AUTH STATE
   ========================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (user) {

      try {

        /*
          For a new registration use the
          Name + Mobile entered in the form.
        */

        let registerName = "";

        let registerMobile = "";


        if (pendingRegistration) {

          registerName =
            pendingRegistration.name;

          registerMobile =
            pendingRegistration.mobile;

        }


        const data =
          await createUserProfile(
            user,
            registerName,
            registerMobile
          );


        /*
          Clear temporary registration data
          AFTER profile is successfully created.
        */

        pendingRegistration = null;


        /* AUTH AREA */

        document
          .getElementById("authArea")
          .style.display =
          "none";


        /* LOGIN AREA */

        document
          .getElementById("loggedIn")
          .style.display =
          "block";


        /* GAME MENU */

        document
          .getElementById("gameMenu")
          .style.display =
          "block";


        /* USER ID */

        document
          .getElementById("userIdBar")
          .style.display =
          "block";


        document
          .getElementById("displayUserId")
          .innerText =
          data.magikNumberId || "---";


        /* WELCOME NAME */

        document
          .getElementById("userName")
          .innerText =
          "Name: " +
          (data.name || "---");


        /* EMAIL */

        document
          .getElementById("userEmail")
          .innerText =
          "Email: " +
          (data.email || "---");


        /* PROFILE */

        document
          .getElementById("profileId")
          .innerText =
          data.magikNumberId || "---";


        document
          .getElementById("profileName")
          .innerText =
          data.name || "---";


        document
          .getElementById("profileEmail")
          .innerText =
          data.email || "---";


        document
          .getElementById("profileMobile")
          .innerText =
          data.mobile ||
          "Not added";


        document
          .getElementById("profilePoints")
          .innerText =
          data.points || 0;


        /* SCORE CARD */

        updateScoreCard(data);


        showMessage("");

      }

      catch (error) {

        console.error(error);

        showFirebaseError(error);

      }

    }

    else {

      document
        .getElementById("authArea")
        .style.display =
        "block";

      document
        .getElementById("loggedIn")
        .style.display =
        "none";

      document
        .getElementById("gameMenu")
        .style.display =
        "none";

      document
        .getElementById("profile")
        .style.display =
        "none";

      document
        .getElementById("scoreCard")
        .style.display =
        "none";

      document
        .getElementById("userIdBar")
        .style.display =
        "none";

    }

  }
);


/* =========================================
   SCORE CARD
   ========================================= */

function updateScoreCard(data) {

  document
    .getElementById("scoreId")
    .innerText =
    data.magikNumberId || "---";


  document
    .getElementById("scoreJoiningDate")
    .innerText =
    data.joiningDate || "---";


  document
    .getElementById("scoreName")
    .innerText =
    data.name || "---";


  document
    .getElementById("scoreGames")
    .innerText =
    data.gamesPlayed || 0;


  document
    .getElementById("scorePoints")
    .innerText =
    data.points || 0;


  document
    .getElementById("scoreCash")
    .innerText =
    "₹" +
    (data.cashBalance || 0);

}


/* =========================================
   SHOW SCORE CARD
   ========================================= */

window.showScoreCard =
function() {

  document
    .getElementById("loggedIn")
    .style.display =
    "none";

  document
    .getElementById("gameMenu")
    .style.display =
    "none";

  document
    .getElementById("profile")
    .style.display =
    "none";

  document
    .getElementById("scoreCard")
    .style.display =
    "block";

};


/* =========================================
   CLOSE SCORE CARD
   ========================================= */

window.closeScoreCard =
function() {

  document
    .getElementById("scoreCard")
    .style.display =
    "none";

  document
    .getElementById("loggedIn")
    .style.display =
    "block";

  document
    .getElementById("gameMenu")
    .style.display =
    "block";

};


/* =========================================
   CONVERT POINTS
   ========================================= */

window.convertPointsToCash =
async function() {

  const user =
    auth.currentUser;


  if (!user) {

    alert(
      "Please login first."
    );

    return;

  }


  const userRef =
    doc(db, "users", user.uid);


  try {

    const snapshot =
      await getDoc(userRef);


    if (!snapshot.exists()) {

      alert(
        "User profile not found."
      );

      return;

    }


    const data =
      snapshot.data();


    const points =
      Number(
        data.points || 0
      );


    if (points < 100) {

      alert(
        "Minimum 100 points required."
      );

      return;

    }


    const cash =
      Math.floor(
        points / 100
      ) * 10;


    const usedPoints =
      Math.floor(
        points / 100
      ) * 100;


    const remainingPoints =
      points - usedPoints;


    const oldCash =
      Number(
        data.cashBalance || 0
      );


    const newCash =
      oldCash + cash;


    const confirmConvert =
      confirm(
        "Convert " +
        usedPoints +
        " points into ₹" +
        cash +
        "?"
      );


    if (!confirmConvert) {

      return;

    }


    await updateDoc(
      userRef,
      {

        points:
          remainingPoints,

        cashBalance:
          newCash

      }
    );


    alert(
      "Conversion successful!\n\n" +
      "Points converted: " +
      usedPoints +
      "\nCash added: ₹" +
      cash
    );


    const updated =
      await getDoc(userRef);


    updateScoreCard(
      updated.data()
    );


    document
      .getElementById("profilePoints")
      .innerText =
      updated.data().points || 0;

  }

  catch (error) {

    showFirebaseError(error);

  }

};


/* =========================================
   PROFILE
   ========================================= */

window.showProfile =
function() {

  document
    .getElementById("profile")
    .style.display =
    "block";

  document
    .getElementById("loggedIn")
    .style.display =
    "none";

  document
    .getElementById("gameMenu")
    .style.display =
    "none";

  document
    .getElementById("scoreCard")
    .style.display =
    "none";

};


window.closeProfile =
function() {

  document
    .getElementById("profile")
    .style.display =
    "none";

  document
    .getElementById("loggedIn")
    .style.display =
    "block";

  document
    .getElementById("gameMenu")
    .style.display =
    "block";

};


/* =========================================
   CLOSE ACCOUNT
   ========================================= */

window.closeAccount =
async function() {

  const user =
    auth.currentUser;


  if (!user) {

    alert(
      "Please login first."
    );

    return;

  }


  const firstConfirm =
    confirm(
      "Are you sure you want to close your MAGIKNUMBER account?"
    );


  if (!firstConfirm) {

    return;

  }


  const secondConfirm =
    confirm(
      "This will close your account. Continue?"
    );


  if (!secondConfirm) {

    return;

  }


  await signOut(auth);


  alert(
    "Your account has been closed from this session."
  );

};


/* =========================================
   LOGOUT
   ========================================= */

window.logoutUser =
async function() {

  try {

    await signOut(auth);

  }

  catch (error) {

    showFirebaseError(error);

  }

};


/* =========================================
   GAME MENU
   ========================================= */

window.openGame =
function(game) {

  if (game === "score") {

    showScoreCard();

  }


  if (game === "diamond") {

    alert(
      "DIAMOND GAME – 5 MINUTES\nComing next."
    );

  }


  if (game === "gold") {

    alert(
      "GOLD GAME – 1 MINUTE\nComing next."
    );

  }


  if (game === "silver") {

    alert(
      "SILVER GAME – 1 MINUTE\nComing next."
    );

  }

};


/* =========================================
   MESSAGE
   ========================================= */

function showMessage(text) {

  document
    .getElementById("message")
    .innerText =
    text;

}


/* =========================================
   FIREBASE ERROR
   ========================================= */

function showFirebaseError(error) {

  console.error(error);


  const message =
    error?.message ||
    String(error);


  document
    .getElementById("firebaseError")
    .style.display =
    "block";


  document
    .getElementById("firebaseError")
    .innerText =
    "Firebase Error:\n" +
    message;


  document
    .getElementById("message")
    .innerText =
    "There is a Firebase problem.";

}

</script>
