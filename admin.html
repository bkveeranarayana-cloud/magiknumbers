<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAGIKNUMBER Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

/* LOGIN */

.loginCard{
  width:92%;
  max-width:380px;
  background:white;
  padding:30px 22px;
  border-radius:18px;

  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  text-align:center;

  box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.loginCard h1{
  margin:0 0 8px;
}

.subtitle{
  color:#64748b;
  margin-bottom:22px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #cbd5e1;
  border-radius:10px;
  font-size:16px;
}

.loginBtn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#loginMessage{
  margin-top:14px;
  color:#dc2626;
  font-size:14px;
}

/* ADMIN */

.adminPanel{
  display:none;
  min-height:100vh;
}

.header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

.header h2{
  margin:0;
  font-size:21px;
}

.dashboard{
  width:94%;
  max-width:900px;
  margin:auto;
  padding:20px 0 40px;
}

/* FRAMES */

.frames{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.frame{
  background:white;
  border-radius:16px;
  padding:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.registration{
  border:2px solid #2563eb;
}

.deletion{
  border:2px solid #dc2626;
}

.frameTitle{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  padding-bottom:12px;
  margin-bottom:8px;
  border-bottom:2px solid #e5e7eb;
}

.registration .frameTitle{
  color:#2563eb;
}

.deletion .frameTitle{
  color:#dc2626;
}

/* STAT */

.statRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 4px;
  border-bottom:1px solid #e5e7eb;
}

.statRow:last-child{
  border-bottom:0;
}

.statName{
  font-size:14px;
  font-weight:bold;
  color:#475569;
}

.statRight{
  text-align:right;
}

.statValue{
  font-size:22px;
  font-weight:bold;
}

.change{
  display:block;
  margin-top:3px;
  font-size:12px;
  font-weight:bold;
}

.up{
  color:#16a34a;
}

.down{
  color:#dc2626;
}

.noChange{
  color:#64748b;
}

/* BUTTONS */

.logoutBtn,
.refreshBtn{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.refreshBtn{
  background:#2563eb;
}

.logoutBtn{
  background:#dc2626;
}

/* LOADING */

.loading{
  text-align:center;
  padding:30px;
  color:#64748b;
}

/* MOBILE */

@media(max-width:650px){

  .frames{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>


<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<div class="loginCard" id="loginCard">

  <h1>MAGIKNUMBER</h1>

  <div class="subtitle">
    ADMIN LOGIN
  </div>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    class="loginBtn"
    id="loginButton">
    LOGIN
  </button>

  <div id="loginMessage"></div>

</div>


<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div
  class="adminPanel"
  id="adminPanel">

  <div class="header">

    <h2>
      MAGIKNUMBER ADMIN
    </h2>

  </div>


  <div class="dashboard">

    <div
      id="loading"
      class="loading">

      Loading dashboard...

    </div>


    <div
      id="dashboardContent"
      style="display:none;">

      <div class="frames">


        <!-- =================================================
             REGISTRATION
        ================================================== -->

        <div class="frame registration">

          <div class="frameTitle">
            REGISTRATION
          </div>


          <div class="statRow">

            <div class="statName">
              TOTAL REGISTERED
            </div>

            <div
              class="statRight statValue"
              id="totalRegistered">
              0
            </div>

          </div>


          <div class="statRow">

            <div class="statName">
              TODAY REGISTERED
            </div>

            <div class="statRight">

              <div
                class="statValue"
                id="todayRegistered">
                0
              </div>

              <span
                class="change"
                id="todayChange">
              </span>

            </div>

          </div>


          <div class="statRow">

            <div class="statName">
              LAST 7 DAYS
            </div>

            <div class="statRight">

              <div
                class="statValue"
                id="sevenDaysRegistered">
                0
              </div>

              <span
                class="change"
                id="sevenDaysChange">
              </span>

            </div>

          </div>


          <div class="statRow">

            <div class="statName">
              LAST 30 DAYS
            </div>

            <div class="statRight">

              <div
                class="statValue"
                id="thirtyDaysRegistered">
                0
              </div>

              <span
                class="change"
                id="thirtyDaysChange">
              </span>

            </div>

          </div>

        </div>


        <!-- =================================================
             ACCOUNT DELETION
        ================================================== -->

        <div class="frame deletion">

          <div class="frameTitle">
            ACCOUNT DELETION
          </div>


          <div class="statRow">

            <div class="statName">
              TOTAL DELETED
            </div>

            <div
              class="statValue"
              id="totalDeleted">
              0
            </div>

          </div>


          <div class="statRow">

            <div class="statName">
              TODAY DELETED
            </div>

            <div
              class="statValue"
              id="todayDeleted">
              0
            </div>

          </div>


          <div class="statRow">

            <div class="statName">
              LAST 7 DAYS
            </div>

            <div
              class="statValue"
              id="sevenDaysDeleted">
              0
            </div>

          </div>


          <div class="statRow">

            <div class="statName">
              LAST 30 DAYS
            </div>

            <div
              class="statValue"
              id="thirtyDaysDeleted">
              0
            </div>

          </div>

        </div>

      </div>


      <button
        class="refreshBtn"
        id="refreshButton">
        REFRESH DATA
      </button>


      <button
        class="logoutBtn"
        id="logoutButton">
        LOGOUT
      </button>

    </div>

  </div>

</div>


<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";


import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  getDocs,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyCX8mVCr-i4m_7uADo_Y41hpvg1OrLlVI",

  authDomain:
  "magiknumbers-d42c0.firebaseapp.com",

  projectId:
  "magiknumbers-d42c0",

  storageBucket:
  "magiknumbers-d42c0.firebasestorage.app",

  messagingSenderId:
  "977553928698",

  appId:
  "1:977553928698:web:0c9c5c59fe5b6a9ef5b443"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   LOGIN SESSION
   SAVE UNTIL LOGOUT
===================================================== */

await setPersistence(
  auth,
  browserLocalPersistence
);


/*
   IMPORTANT:

   Password is NOT saved.

   Only Firebase Authentication session
   is kept in the browser.

   Browser close:
   session remains.

   Website open again:
   admin can continue.

   LOGOUT:
   session is removed.
*/


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(user){

  if(!user){
    return false;
  }

  try{

    const adminDoc =
      await getDoc(
        doc(
          db,
          "admins",
          user.uid
        )
      );


    return (
      adminDoc.exists() &&
      adminDoc.data().role === "admin"
    );

  }
  catch(error){

    console.error(
      "Admin check error:",
      error
    );

    return false;

  }

}


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginButton")
.addEventListener(
  "click",
  async function(){

    const email =
      document
      .getElementById("email")
      .value
      .trim();


    const password =
      document
      .getElementById("password")
      .value;


    const message =
      document
      .getElementById("loginMessage");


    message.textContent = "";


    if(!email || !password){

      message.textContent =
        "Please enter email and password.";

      return;

    }


    try{

      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const isAdmin =
        await checkAdmin(
          result.user
        );


      if(!isAdmin){

        await signOut(auth);

        message.textContent =
          "Access denied. Admin account required.";

        return;

      }


      /*
       * Password field is cleared.
       */

      document
      .getElementById("password")
      .value = "";


      showDashboard();

    }
    catch(error){

      console.error(error);

      message.textContent =
        "Login failed: " +
        error.message;

    }

  }
);


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(){

  document
  .getElementById("loginCard")
  .style.display =
    "none";


  document
  .getElementById("adminPanel")
  .style.display =
    "block";


  loadDashboard();

}


/* =====================================================
   DATE
===================================================== */

function getDate(value){

  if(!value){
    return null;
  }


  try{

    if(
      typeof value.toDate ===
      "function"
    ){

      return value.toDate();

    }


    const date =
      new Date(value);


    if(
      isNaN(date.getTime())
    ){

      return null;

    }


    return date;

  }
  catch(error){

    return null;

  }

}


function startOfDay(date){

  const result =
    new Date(date);

  result.setHours(
    0,
    0,
    0,
    0
  );

  return result;

}


/* =====================================================
   COUNT REGISTRATION
===================================================== */

function countBetween(
  records,
  start,
  end
){

  let count = 0;


  records.forEach(
    record => {

      const date =
        getDate(
          record.dateOfJoining
        );


      if(!date){
        return;
      }


      if(
        date >= start &&
        date < end
      ){

        count++;

      }

    }
  );


  return count;

}


/* =====================================================
   COUNT DELETED
===================================================== */

function countDeletedBetween(
  records,
  start,
  end
){

  let count = 0;


  records.forEach(
    record => {

      const date =
        getDate(
          record.deletedAt
        );


      if(!date){
        return;
      }


      if(
        date >= start &&
        date < end
      ){

        count++;

      }

    }
  );


  return count;

}


/* =====================================================
   PERCENTAGE CHANGE
===================================================== */

function percentageChange(
  current,
  previous
){

  if(previous === 0){

    if(current === 0){

      return 0;

    }


    return null;

  }


  return Math.round(
    (
      (current - previous)
      / previous
    ) * 100
  );

}


/* =====================================================
   SHOW CHANGE
===================================================== */

function showChange(
  elementId,
  current,
  previous
){

  const element =
    document.getElementById(
      elementId
    );


  const change =
    percentageChange(
      current,
      previous
    );


  if(change === null){

    element.textContent =
      current > 0
      ? "NEW"
      : "0%";


    element.className =
      "change noChange";


    return;

  }


  if(change > 0){

    element.textContent =
      "▲ " +
      change +
      "%";


    element.className =
      "change up";

  }
  else if(change < 0){

    element.textContent =
      "▼ " +
      Math.abs(change) +
      "%";


    element.className =
      "change down";

  }
  else{

    element.textContent =
      "0%";


    element.className =
      "change noChange";

  }

}


/* =====================================================
   LOAD DASHBOARD
===================================================== */

async function loadDashboard(){

  const loading =
    document.getElementById(
      "loading"
    );


  const content =
    document.getElementById(
      "dashboardContent"
    );


  loading.textContent =
    "Loading dashboard...";


  loading.style.display =
    "block";


  content.style.display =
    "none";


  try{


    /* =================================================
       USERS
    ================================================= */

    const usersSnapshot =
      await getDocs(
        collection(
          db,
          "users"
        )
      );


    const users = [];


    usersSnapshot.forEach(
      item => {

        users.push(
          item.data()
        );

      }
    );


    /* =================================================
       CURRENT DATE
    ================================================= */

    const now =
      new Date();


    const todayStart =
      startOfDay(now);


    const tomorrowStart =
      new Date(
        todayStart
      );


    tomorrowStart.setDate(
      tomorrowStart.getDate() + 1
    );


    /* =================================================
       YESTERDAY
    ================================================= */

    const yesterdayStart =
      new Date(
        todayStart
      );


    yesterdayStart.setDate(
      yesterdayStart.getDate() - 1
    );


    /* =================================================
       LAST 7 DAYS
    ================================================= */

    const sevenStart =
      new Date(
        todayStart
      );


    sevenStart.setDate(
      sevenStart.getDate() - 6
    );


    const previousSevenStart =
      new Date(
        todayStart
      );


    previousSevenStart.setDate(
      previousSevenStart.getDate() - 13
    );


    /* =================================================
       LAST 30 DAYS
    ================================================= */

    const thirtyStart =
      new Date(
        todayStart
      );


    thirtyStart.setDate(
      thirtyStart.getDate() - 29
    );


    const previousThirtyStart =
      new Date(
        todayStart
      );


    previousThirtyStart.setDate(
      previousThirtyStart.getDate() - 59
    );


    /* =================================================
       REGISTRATION
    ================================================= */

    const totalRegistered =
      users.length;


    const todayRegistered =
      countBetween(
        users,
        todayStart,
        tomorrowStart
      );


    const yesterdayRegistered =
      countBetween(
        users,
        yesterdayStart,
        todayStart
      );


    const sevenDaysRegistered =
      countBetween(
        users,
        sevenStart,
        tomorrowStart
      );


    const previousSevenRegistered =
      countBetween(
        users,
        previousSevenStart,
        sevenStart
      );


    const thirtyDaysRegistered =
      countBetween(
        users,
        thirtyStart,
        tomorrowStart
      );


    const previousThirtyRegistered =
      countBetween(
        users,
        previousThirtyStart,
        thirtyStart
      );


    /* =================================================
       DISPLAY REGISTRATION
    ================================================= */

    document
    .getElementById(
      "totalRegistered"
    )
    .textContent =
      totalRegistered;


    document
    .getElementById(
      "todayRegistered"
    )
    .textContent =
      todayRegistered;


    document
    .getElementById(
      "sevenDaysRegistered"
    )
    .textContent =
      sevenDaysRegistered;


    document
    .getElementById(
      "thirtyDaysRegistered"
    )
    .textContent =
      thirtyDaysRegistered;


    /* =================================================
       REGISTRATION %
    ================================================= */

    showChange(
      "todayChange",
      todayRegistered,
      yesterdayRegistered
    );


    showChange(
      "sevenDaysChange",
      sevenDaysRegistered,
      previousSevenRegistered
    );


    showChange(
      "thirtyDaysChange",
      thirtyDaysRegistered,
      previousThirtyRegistered
    );


    /* =================================================
       ACCOUNT DELETION
    ================================================= */

    let deleted = [];


    try{

      const deletionSnapshot =
        await getDocs(
          collection(
            db,
            "accountDeletions"
          )
        );


      deletionSnapshot.forEach(
        item => {

          deleted.push(
            item.data()
          );

        }
      );

    }
    catch(error){

      console.log(
        "Deletion collection not available yet."
      );

    }


    const totalDeleted =
      deleted.length;


    const todayDeleted =
      countDeletedBetween(
        deleted,
        todayStart,
        tomorrowStart
      );


    const sevenDaysDeleted =
      countDeletedBetween(
        deleted,
        sevenStart,
        tomorrowStart
      );


    const thirtyDaysDeleted =
      countDeletedBetween(
        deleted,
        thirtyStart,
        tomorrowStart
      );


    /* =================================================
       DISPLAY DELETION
    ================================================= */

    document
    .getElementById(
      "totalDeleted"
    )
    .textContent =
      totalDeleted;


    document
    .getElementById(
      "todayDeleted"
    )
    .textContent =
      todayDeleted;


    document
    .getElementById(
      "sevenDaysDeleted"
    )
    .textContent =
      sevenDaysDeleted;


    document
    .getElementById(
      "thirtyDaysDeleted"
    )
    .textContent =
      thirtyDaysDeleted;


    /* =================================================
       SHOW DASHBOARD
    ================================================= */

    loading.style.display =
      "none";


    content.style.display =
      "block";


  }
  catch(error){

    console.error(
      "Dashboard error:",
      error
    );


    loading.textContent =
      "Unable to load dashboard: " +
      error.message;

  }

}


/* =====================================================
   REFRESH
===================================================== */

document
.getElementById("refreshButton")
.addEventListener(
  "click",
  loadDashboard
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutButton")
.addEventListener(
  "click",
  async function(){

    try{

      await signOut(auth);

      /*
       * Firebase session is now cleared.
       * Next time login is required.
       */

      location.reload();

    }
    catch(error){

      console.error(
        "Logout error:",
        error
      );

    }

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  async function(user){


    if(!user){

      document
      .getElementById("loginCard")
      .style.display =
        "block";


      document
      .getElementById("adminPanel")
      .style.display =
        "none";


      return;

    }


    const isAdmin =
      await checkAdmin(
        user
      );


    if(isAdmin){

      showDashboard();

    }
    else{

      await signOut(auth);

    }

  }
);

</script>

</body>
</html>
