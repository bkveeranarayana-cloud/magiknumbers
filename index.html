<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAGIKNUMBER</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef2ff;color:#111827}
.page{display:none;max-width:600px;margin:auto;padding:15px}.active{display:block}
.card{background:white;padding:18px;border-radius:16px;margin-bottom:15px;box-shadow:0 4px 15px #0002}
h1,h2,h3{text-align:center}input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #bbb;border-radius:8px;font-size:16px}
button{border:0;border-radius:9px;padding:11px 16px;margin:5px;font-weight:bold;font-size:15px}
.green{background:#16a34a;color:white}.blue{background:#2563eb;color:white}.red{background:#dc2626;color:white}
.gray{background:#64748b;color:white}.purple{background:#7c3aed;color:white}.orange{background:#ea580c;color:white}
.menu{width:100%;margin:9px 0;padding:15px}.hidden{display:none!important}
#userBar{display:none;position:fixed;top:0;left:0;width:100%;height:52px;background:#111827;color:white;z-index:5000;align-items:center;padding:4px 10px}
#userLogo{width:42px;height:42px;background:white;color:#111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-right:9px}
.game{min-height:100vh;padding:15px 5px;color:white}.diamond{background:linear-gradient(135deg,#581c87,#2563eb)}.gold{background:linear-gradient(135deg,#f59e0b,#ea580c)}.silver{background:linear-gradient(135deg,#64748b,#334155)}
.hint{text-align:center;background:#ffffff30;padding:10px;border-radius:10px;font-weight:bold}
.timer{background:white;color:#111;text-align:center;font-size:30px;font-weight:bold;padding:8px;border-radius:12px;width:160px;margin:12px auto}
.board{display:grid;gap:5px;justify-content:center;width:max-content;margin:auto}
.box{width:50px;height:50px;padding:3px;text-align:center;font-size:19px;font-weight:bold;border-radius:8px;border:2px solid #ccc}
.tot{width:50px;height:38px;background:#fff;color:#111;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold}
.rowtot{width:55px}.entered{text-align:center;background:#ffffff30;padding:10px;border-radius:10px;margin:12px}
#popupOverlay{position:fixed;inset:0;width:100vw;height:100vh;background:#0009;display:none;align-items:center;justify-content:center;z-index:99999;padding:20px}
.popup{background:white;color:#111;width:100%;max-width:370px;padding:20px;border-radius:17px;text-align:center}
.logos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.logos button{font-size:25px;background:#f1f5f9}
.result{display:grid;gap:5px;justify-content:center}.rbox{width:45px;height:45px;border:2px solid #ccc;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:bold;background:white}
.line{display:flex;justify-content:space-between;padding:4px}
</style>
</head>
<body>

<div id="userBar"><div id="userLogo" onclick="logoPop()">⚡</div><b id="uid">ID: --</b></div>

<div id="auth" class="page active">
<div class="card">
<h1>MAGIKNUMBER</h1><h2>LOGIN</h2>
<input id="le" placeholder="Email">
<input id="lp" type="password" placeholder="Password">
<label><input type="checkbox" style="width:auto" onclick="pw('lp')"> Show Password</label>
<button class="green" style="width:100%" onclick="login()">LOGIN</button>
<button style="width:100%" onclick="google()">Continue with Google</button>
</div>

<div class="card">
<h2>REGISTER</h2>
<input id="rn" placeholder="Name">
<select id="country" onchange="countryChange()"></select>
<input id="rm" type="tel" placeholder="Mobile">
<input id="re" placeholder="Email">
<input id="rp" type="password" placeholder="Password">
<label><input type="checkbox" style="width:auto" onclick="pw('rp')"> Show Password</label>
<button class="blue" style="width:100%" onclick="register()">REGISTER</button>
</div>

<div class="card"><h3>RULES</h3><p>0-25 numbers only. Same number cannot be repeated.</p></div>
</div>

<div id="menu" class="page">
<div class="card"><h1>MAGIKNUMBER</h1>
<button class="purple menu" onclick="score()">SCOREBOARD</button>
<button class="purple menu" onclick="start('DIAMOND')">DIAMOND – 5 MINUTES</button>
<button class="orange menu" onclick="start('GOLD')">GOLD – 1 MINUTE</button>
<button class="gray menu" onclick="start('SILVER')">SILVER – 1 MINUTE</button>
<button class="red menu" onclick="logout()">LOGOUT</button>
</div></div>

<div id="score" class="page"><div class="card">
<h2>SCOREBOARD</h2>
<p><b>MAGIKNUMBER ID</b><br><span id="pid"></span></p>
<p><b>Date of Joining</b><br><span id="pdate"></span></p>
<p><b>Name</b><br><span id="pname"></span></p>
<p><b>Email</b><br><span id="pemail"></span></p>
<button class="blue" onclick="emailPop()">Update Email</button>
<p><b>Mobile</b><br><span id="pmobile"></span></p>
<button class="blue" onclick="mobilePop()">Update Mobile</button>
<p><b>Total Games Played:</b> <span id="pgames">0</span></p>
<p><b>Earned Points:</b> <span id="ppoints">0</span></p>
<button class="purple" style="width:100%" onclick="pop('Points redemption will be added later.')">REDEEM POINTS</button>
<button class="blue" style="width:100%" onclick="pop('Redemption history will appear here.')">REDEMPTION HISTORY</button>
<button class="red" style="width:100%" onclick="closeAccount()">CLOSE ACCOUNT</button>
<button class="gray" style="width:100%" onclick="menu()">BACK</button>
</div></div>

<div id="game" class="page"><div id="gameBox"></div></div>

<div id="result" class="page"><div class="card">
<h2 id="rt"></h2><h3>YOUR ANSWER</h3><div id="ya"></div>
<h3>OUR ANSWER</h3><div id="oa"></div>
<div id="pb"></div><div id="msg" class="card"></div>
<button class="blue" style="width:100%" onclick="menu()">BACK TO MENU</button>
</div></div>

<div id="popupOverlay"><div class="popup">
<h3 id="pt">MAGIKNUMBER</h3><div id="pm"></div><div id="pbtn"></div>
</div></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,updateEmail}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,runTransaction,increment}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"AIzaSyCX8mVCrI-qm4_7uADo_Y41hpvg1OrLlVI",
authDomain:"magiknumbers-d42c0.firebaseapp.com",
projectId:"magiknumbers-d42c0",
storageBucket:"magiknumbers-d42c0.firebasestorage.app",
messagingSenderId:"977553928698",
appId:"1:977553928698:web:0c9c5c59fe5b6a9ef5b443"
});
const auth=getAuth(app),db=getFirestore(app);

const countries=[
["India","+91",10],["USA","+1",10],["Canada","+1",10],["UK","+44",10],
["Australia","+61",9],["New Zealand","+64",9],["UAE","+971",9],
["Saudi Arabia","+966",9],["Qatar","+974",8],["Kuwait","+965",8],
["Oman","+968",8],["Bahrain","+973",8],["Singapore","+65",8],
["Malaysia","+60",9],["Sri Lanka","+94",9],["Bangladesh","+880",10],
["Pakistan","+92",10],["Nepal","+977",10],["Japan","+81",10],
["Germany","+49",11],["France","+33",9],["Italy","+39",10],
["Spain","+34",9],["Russia","+7",10],["Brazil","+55",11],["South Africa","+27",9]
];

countries.forEach(x=>{
let o=document.createElement("option");o.value=x[1]+"|"+x[2];o.textContent=x[0]+" ("+x[1]+")";country.appendChild(o)
});
window.countryChange=()=>{rm.maxLength=+country.value.split("|")[1]};
countryChange();

const GAME_CONFIG={
DIAMOND:{
name:"DIAMOND",rows:5,cols:5,duration:300,
hintRow:60,hintColumn:60,hintTotal:300,
answer:[[16,23,0,7,14],[22,4,6,13,15],[3,5,12,19,21],[9,11,18,20,2],[10,17,24,1,8]],
points:{row:10,column:10,diagonal1:10,diagonal2:10,table:50}
},
GOLD:{
name:"GOLD",rows:3,cols:3,duration:60,
hintRow:15,hintColumn:15,hintTotal:45,
answer:[[8,1,6],[3,5,7],[4,9,2]],
points:{row:5,column:5,diagonal1:5,diagonal2:5,table:25}
},
SILVER:{
name:"SILVER",rows:3,cols:3,duration:60,
hintTotal:150,tableTarget:45,
answer:[[6,1,8],[7,5,3],[2,9,4]],
points:{row:0,column:0,diagonal1:0,diagonal2:0,table:25}
}
};

let user=null,current="",timer,time=0,ended=false;

const pages=["auth","menu","score","game","result"];
function show(x){pages.forEach(p=>document.getElementById(p).classList.remove("active"));document.getElementById(x).classList.add("active");scrollTo(0,0)}
window.menu=()=>show("menu");

window.pw=id=>{let x=document.getElementById(id);x.type=x.type=="password"?"text":"password"};

window.pop=(m,t="MAGIKNUMBER")=>{
pt.innerText=t;pm.innerText=m;pbtn.innerHTML='<button class="blue" onclick="closePop()">OK</button>';
popupOverlay.style.display="flex";document.body.style.overflow="hidden"
};
window.closePop=()=>{popupOverlay.style.display="none";document.body.style.overflow=""};

async function makeId(){
return await runTransaction(db,async(tx)=>{
let r=await tx.get(doc(db,"system","counter")),n=r.exists()?Number(r.data().nextNumber||100001):100001;
tx.set(doc(db,"system","counter"),{nextNumber:n+1},{merge:true});return"MN"+n
})}

window.register=async()=>{
try{
let m=rm.value.trim(),c=country.value.split("|");
if(!rn.value||!re.value||!rp.value||!m)return pop("Please fill all fields.");
if(m.length!=+c[1])return pop("Invalid mobile number.");
let q=await createUserWithEmailAndPassword(auth,re.value,rp.value),id=await makeId();
await setDoc(doc(db,"users",q.user.uid),{
magikNumberId:id,name:rn.value,email:re.value,mobile:c[0]+" "+m,
points:0,gamesPlayed:0,dateOfJoining:new Date().toISOString(),logo:"⚡",closeRequestedAt:null
});
pop("Registration successful.");
}catch(e){pop(e.message)}
};

window.login=async()=>{try{await signInWithEmailAndPassword(auth,le.value,lp.value)}catch(e){pop(e.message)}};
window.google=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){pop(e.message)}};
window.logout=()=>auth.signOut();

async function profile(){
let r=doc(db,"users",user.uid),s=await getDoc(r);
if(!s.exists()){
let id=await makeId();
await setDoc(r,{magikNumberId:id,name:user.displayName||"",email:user.email||"",mobile:"",points:0,gamesPlayed:0,dateOfJoining:new Date().toISOString(),logo:"⚡",closeRequestedAt:null});
s=await getDoc(r)
}
let d=s.data();uid.innerText="ID: "+d.magikNumberId;userLogo.innerText=d.logo||"⚡";
}

onAuthStateChanged(auth,async u=>{
if(u){user=u;await profile();userBar.style.display="flex";menu()}
else{user=null;userBar.style.display="none";show("auth")}
});

window.logoPop=()=>{
pt.innerText="SELECT LOGO";pm.innerHTML="";pbtn.innerHTML='<div class="logos">'+["⚡","🎯","🚀","🔥","👑","💎","🌀","🌟"].map(x=>`<button onclick="setLogo('${x}')">${x}</button>`).join("")+"</div>";
popupOverlay.style.display="flex"
};
window.setLogo=async x=>{userLogo.innerText=x;await updateDoc(doc(db,"users",user.uid),{logo:x});closePop()};

window.score=async()=>{
let s=await getDoc(doc(db,"users",user.uid)),d=s.data();
pid.innerText=d.magikNumberId||"--";pdate.innerText=d.dateOfJoining?new Date(d.dateOfJoining).toLocaleDateString():"--";
pname.innerText=d.name||"--";pemail.innerText=d.email||"--";pmobile.innerText=d.mobile||"--";
pgames.innerText=d.gamesPlayed||0;ppoints.innerText=d.points||0;show("score")
};

window.emailPop=()=>{
pt.innerText="UPDATE EMAIL";pm.innerHTML='<input id="ne" placeholder="New Email">';
pbtn.innerHTML='<button class="blue" onclick="saveEmail()">CONFIRM</button><button class="gray" onclick="closePop()">CANCEL</button>';
popupOverlay.style.display="flex"
};
window.saveEmail=async()=>{
try{await updateEmail(user,ne.value.trim());await updateDoc(doc(db,"users",user.uid),{email:ne.value.trim()});pop("Email updated successfully.")}catch(e){pop(e.message)}
};

window.mobilePop=()=>{
pt.innerText="UPDATE MOBILE";pm.innerHTML='<select id="uc"></select><input id="nm" placeholder="Mobile">';
countries.forEach(x=>{let o=document.createElement("option");o.value=x[1]+"|"+x[2];o.textContent=x[0]+" ("+x[1]+")";uc.appendChild(o)});
pbtn.innerHTML='<button class="blue" onclick="saveMobile()">CONFIRM</button><button class="gray" onclick="closePop()">CANCEL</button>';popupOverlay.style.display="flex"
};
window.saveMobile=async()=>{
let c=uc.value.split("|"),m=nm.value.trim();if(m.length!=+c[1])return pop("Invalid mobile number.");
await updateDoc(doc(db,"users",user.uid),{mobile:c[0]+" "+m});pop("Mobile updated successfully.")
};

window.closeAccount=()=>{
pt.innerText="CLOSE ACCOUNT";pm.innerText="Do you really want to close account permanently?";
pbtn.innerHTML='<button class="red" onclick="confirmClose()">YES</button><button class="gray" onclick="closePop()">NO</button>';popupOverlay.style.display="flex"
};
window.confirmClose=async()=>{
await updateDoc(doc(db,"users",user.uid),{closeRequestedAt:new Date().toISOString()});
pop("If you will not relogin before 30 days from today, your account will be deleted permanently.")
};

window.start=g=>{
current=g;let c=GAME_CONFIG[g];ended=false;time=c.duration;show("game");
gameBox.innerHTML=`<div class="game ${g.toLowerCase()}"><h2>${g}</h2>
<div class="hint">${g=="SILVER"?`Hint: Total: ${c.hintTotal}`:`Hint: Row Total: ${c.hintRow} | Column Total: ${c.hintColumn} | All Boxes Total: ${c.hintTotal}`}</div>
<div class="timer" id="tm">${fmt(time)}</div><div class="board" id="bd"></div>
<div class="entered" id="et">Your Entered Total: 0</div>
<center><button class="green" onclick="answer()">ANSWER</button><button class="gray" onclick="back()">BACK</button></center></div>`;
makeBoard();clearInterval(timer);timer=setInterval(()=>{time--;tm.innerText=fmt(Math.max(0,time));if(time<=0)end()},1000)
};

function fmt(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}

function makeBoard(){
let c=GAME_CONFIG[current];bd.innerHTML="";bd.style.gridTemplateColumns=`repeat(${c.cols},50px) ${current=="SILVER"?"0":"55px"}`;
if(current!="SILVER"){
for(let j=0;j<c.cols;j++)bd.innerHTML+=`<div class="tot" id="c${j}">0</div>`;
bd.innerHTML+='<div class="tot"></div>'
}
for(let r=0;r<c.rows;r++){
for(let j=0;j<c.cols;j++)bd.appendChild(input(r,j));
if(current!="SILVER")bd.innerHTML+=`<div class="tot rowtot" id="r${r}">0</div>`
}
};

function input(r,c){
let x=document.createElement("input");x.className="box";x.type="number";x.min=0;x.max=25;x.dataset.r=r;x.dataset.c=c;x.oninput=changed;return x
}

function changed(e){
let x=e.target;if(x.value===""){calc();return}
let n=Number(x.value);
if(!Number.isInteger(n)||n<0||n>25){pop("0-25 numbers only");x.value="";calc();return}
let dup=[...document.querySelectorAll(".box")].some(y=>y!==x&&y.value!==""&&Number(y.value)==n);
if(dup){pop("Same number repeat is not possible.");x.value=""}calc()
}

function calc(){
let c=GAME_CONFIG[current],a=[...document.querySelectorAll(".box")],total=0;
for(let r=0;r<c.rows;r++)for(let j=0;j<c.cols;j++){
let x=a.find(z=>+z.dataset.r==r&&+z.dataset.c==j);
if(x&&x.value!=="")total+=+x.value
}
et.innerText="Your Entered Total: "+total;
if(current!="SILVER"){
for(let r=0;r<c.rows;r++){
let s=0;for(let j=0;j<c.cols;j++){let x=a.find(z=>+z.dataset.r==r&&+z.dataset.c==j);if(x&&x.value!=="")s+=+x.value}
document.getElementById("r"+r).innerText=s
}
for(let j=0;j<c.cols;j++){
let s=0;for(let r=0;r<c.rows;r++){let x=a.find(z=>+z.dataset.r==r&&+z.dataset.c==j);if(x&&x.value!=="")s+=+x.value}
document.getElementById("c"+j).innerText=s
}}
}

function end(){clearInterval(timer);ended=true;document.querySelectorAll(".box").forEach(x=>x.disabled=true)}
window.answer=()=>{if(!ended)return pop("Game is still running");result()};
window.back=()=>{
if(ended)return menu();
pt.innerText="QUIT GAME";pm.innerText="Are you sure do you want quit game?";
pbtn.innerHTML='<button class="red" onclick="confirmQuit()">YES</button><button class="gray" onclick="closePop()">NO</button>';popupOverlay.style.display="flex"
};
window.confirmQuit=()=>{clearInterval(timer);closePop();menu()};

function grid(){
let c=GAME_CONFIG[current],a=[...document.querySelectorAll(".box")],g=[];
for(let r=0;r<c.rows;r++){let row=[];for(let j=0;j<c.cols;j++){let x=a.find(z=>+z.dataset.r==r&&+z.dataset.c==j);row.push(x&&x.value!==""?+x.value:null)}g.push(row)}return g
}

function goodRow(g,r,t){return g[r].every(x=>x!==null)&&g[r].reduce((a,b)=>a+b,0)==t}
function goodCol(g,j,t){return g.every(r=>r[j]!==null)&&g.reduce((a,r)=>a+r[j],0)==t}
function diag1(g,t){return g.every((r,i)=>r[i]!==null)&&g.reduce((a,r,i)=>a+r[i],0)==t}
function diag2(g,t){let n=g.length;return g.every((r,i)=>r[n-1-i]!==null)&&g.reduce((a,r,i)=>a+r[n-1-i],0)==t}
function table(g,t){return g.every(r=>r.every(x=>x!==null))&&g.flat().reduce((a,b)=>a+b,0)==t}

async function result(){
let c=GAME_CONFIG[current],g=grid(),p=c.points,earned=0,lines=[];
for(let r=0;r<c.rows;r++)if(p.row){let ok=goodRow(g,r,c.hintRow);earned+=ok?p.row:0;lines.push([`R${r+1}`,ok?p.row:0])}
for(let j=0;j<c.cols;j++)if(p.column){let ok=goodCol(g,j,c.hintColumn);earned+=ok?p.column:0;lines.push([`C${j+1}`,ok?p.column:0])}
if(p.diagonal1){let ok=diag1(g,c.hintRow);earned+=ok?p.diagonal1:0;lines.push(["D1",ok?p.diagonal1:0])}
if(p.diagonal2){let ok=diag2(g,c.hintRow);earned+=ok?p.diagonal2:0;lines.push(["D2",ok?p.diagonal2:0])}
let target=current=="SILVER"?c.tableTarget:c.hintTotal,ok=table(g,target);earned+=ok?p.table:0;lines.push(["Total Table",ok?p.table:0]);
draw("ya",g);draw("oa",c.answer);
pb.innerHTML=lines.map(x=>`<div class="line"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("")+`<hr><div class="line"><b>Earned Points</b><b>${earned}</b></div>`;
msg.innerText=earned?`You earned ${earned} points.`:"Better luck next time.";
rt.innerText=current+" RESULT";show("result");
try{await updateDoc(doc(db,"users",user.uid),{points:increment(earned),gamesPlayed:increment(1)})}catch(e){console.log(e)}
}

function draw(id,g){
let x=document.getElementById(id);x.innerHTML="";let b=document.createElement("div");b.className="result";b.style.gridTemplateColumns=`repeat(${g[0].length},45px)`;
g.flat().forEach(v=>{let z=document.createElement("div");z.className="rbox";z.innerText=v==null?"—":v;b.appendChild(z)});x.appendChild(b)
}
</script>
</body>
</html>
