<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME GENERATOR</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#111827;
}

.header{
    background:#111827;
    color:white;
    text-align:center;
    padding:17px 10px;
    font-size:23px;
    font-weight:bold;
}

.container{
    max-width:520px;
    margin:15px auto;
    padding:10px;
}

.card{
    background:white;
    border-radius:15px;
    padding:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h2{
    text-align:center;
    margin:5px 0 15px;
    font-size:21px;
}

.game-info{
    background:#eef2ff;
    border-radius:10px;
    padding:12px;
    margin-bottom:15px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin:9px 0;
    font-weight:bold;
}

.game-input,
.game-select{
    width:175px;
    padding:9px;
    border:2px solid #2563eb;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    background:white;
}

.apply-btn{
    width:100%;
    margin-top:12px;
    background:#7c3aed;
    color:white;
    border:0;
    padding:14px;
    border-radius:10px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.magic-area{
    width:100%;
    overflow-x:auto;
    padding:5px 0;
}

.magic-table{
    display:grid;

    grid-template-columns:
        48px
        repeat(5,1fr);

    grid-template-rows:
        42px
        repeat(5,1fr);

    gap:5px;

    width:100%;
    max-width:450px;

    margin:auto;
}

.corner{
    background:transparent;
}

.column-total{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#dbeafe;
    color:#1d4ed8;

    border-radius:8px;

    font-size:15px;
    font-weight:bold;
}

.row-total{
    display:flex;
    align-items:center;
    justify-content:center;

    background:#dcfce7;
    color:#15803d;

    border-radius:8px;

    font-size:15px;
    font-weight:bold;
}

.box{
    aspect-ratio:1/1;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;

    border:2px solid #2563eb;

    border-radius:8px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    user-select:none;

    transition:.15s;
}

.box.selected{
    background:#facc15;
    border-color:#ca8a04;
    color:#111827;

    transform:scale(.94);
}

.diagonal-area{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.diagonal{
    flex:1;

    background:#f3e8ff;
    color:#7e22ce;

    border-radius:9px;

    padding:10px 5px;

    text-align:center;

    font-weight:bold;

    font-size:14px;
}

.status{
    margin-top:12px;

    padding:11px;

    border-radius:9px;

    text-align:center;

    background:#ecfdf5;
    color:#166534;

    font-weight:bold;
}

.selected-info{
    margin-top:12px;

    background:#fff7ed;

    border:1px solid #fed7aa;

    border-radius:9px;

    padding:11px;

    text-align:center;

    font-weight:bold;
}

.selected-numbers{
    margin-top:6px;

    font-size:18px;

    color:#ea580c;
}

.buttons{
    display:flex;

    gap:10px;

    margin-top:15px;
}

button{
    flex:1;

    border:0;

    padding:14px 8px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

.next{
    background:#2563eb;
    color:white;
}

.save{
    background:#16a34a;
    color:white;
}

.back{
    width:100%;

    margin-top:10px;

    background:#6b7280;
    color:white;
}

.saved{
    text-align:center;

    margin-top:13px;

    font-weight:bold;

    color:#15803d;
}

@media(max-width:380px){

    .magic-table{
        grid-template-columns:
            42px
            repeat(5,1fr);

        gap:4px;
    }

    .box{
        font-size:17px;
    }

    .column-total,
    .row-total{
        font-size:13px;
    }

    .game-input,
    .game-select{
        width:145px;
    }

}

</style>

</head>

<body>


<div class="header">
    GAME-GENERATOR
</div>


<div class="container">

<div class="card">

<h2>DIAMOND GAME SETUP</h2>


<div class="game-info">

    <!-- GAME ID -->

    <div class="info-row">

        <span>GAME ID</span>

        <select
            id="gameIdSelect"
            class="game-select">
        </select>

    </div>


    <!-- GRID -->

    <div class="info-row">

        <span>GRID</span>

        <span>5 × 5</span>

    </div>


    <!-- NUMBER RANGE -->

    <div class="info-row">

        <span>NUMBERS</span>

        <span>0 – 100</span>

    </div>


    <!-- MAGIC TOTAL -->

    <div class="info-row">

        <span>MAGIC TOTAL</span>

        <input
            type="number"
            id="magicTotalInput"
            class="game-input"
            placeholder="Enter total"
            min="10"
            max="500">

    </div>


    <!-- APPLY -->

    <button
        class="apply-btn"
        onclick="applySettings()">

        APPLY

    </button>

</div>


<!-- MAGIC TABLE -->

<div class="magic-area">

    <div
        class="magic-table"
        id="magicTable">

    </div>

</div>


<!-- DIAGONALS -->

<div class="diagonal-area">

    <div class="diagonal">

        ↘ DIAGONAL 1

        <br>

        <span id="diagonal1">
            0
        </span>

    </div>


    <div class="diagonal">

        ↙ DIAGONAL 2

        <br>

        <span id="diagonal2">
            0
        </span>

    </div>

</div>


<!-- STATUS -->

<div
    id="status"
    class="status">

    ENTER MAGIC TOTAL AND APPLY

</div>


<!-- SELECTED -->

<div class="selected-info">

    SELECTED NUMBERS

    <div
        id="selectedNumbers"
        class="selected-numbers">

        None

    </div>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <button
        class="next"
        onclick="nextGame()">

        NEXT

    </button>


    <button
        class="save"
        onclick="saveGame()">

        SAVE GAME

    </button>

</div>


<button
    class="back"
    onclick="goBack()">

    BACK TO ADMIN

</button>


<div
    id="savedMessage"
    class="saved">

</div>


</div>

</div>



<script>


/* =====================================================
   SETTINGS
===================================================== */

const MIN_NUMBER = 0;

const MAX_NUMBER = 100;

const GRID_SIZE = 5;

const GAME_COUNT = 250;


/* =====================================================
   VARIABLES
===================================================== */

let currentNumber = 1;

let currentSquare = [];

let selectedCells = [];

let magicTotal = 0;


/* =====================================================
   GAME ID DROPDOWN
===================================================== */

function createGameIds(){

    const select =
        document.getElementById(
            "gameIdSelect"
        );


    select.innerHTML = "";


    for(
        let i=1;
        i<=GAME_COUNT;
        i++
    ){

        const option =
            document.createElement(
                "option"
            );


        const gameId =
            "MKND84" +
            String(i)
                .padStart(4,"0");


        option.value =
            gameId;


        option.textContent =
            gameId;


        select.appendChild(
            option
        );

    }

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array){

    const arr =
        [...array];


    for(
        let i=arr.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i+1)
            );


        [
            arr[i],
            arr[j]
        ] =
        [
            arr[j],
            arr[i]
        ];

    }


    return arr;

}


/* =====================================================
   GET RANDOM UNIQUE NUMBERS
===================================================== */

function getRandomNumbers(count){

    const numbers = [];


    for(
        let n=MIN_NUMBER;
        n<=MAX_NUMBER;
        n++
    ){

        numbers.push(n);

    }


    return shuffle(
        numbers
    ).slice(
        0,
        count
    );

}


/* =====================================================
   CREATE MAGIC SQUARE
=====================================================

   We create a symmetric 5×5 square.

   Every row, column and both diagonals
   have the same total.

===================================================== */

function generateMagicSquare(total){

    /*
       We need 25 numbers.

       Average number must be:

       total / 5

       We create 5 pairs around a center.
    */


    const targetSum =
        total;


    /*
       Try many random formations.
    */

    for(
        let attempt=0;
        attempt<5000;
        attempt++
    ){

        const numbers =
            getRandomNumbers(25);


        /*
           Sort first.
        */

        numbers.sort(
            (a,b)=>a-b
        );


        /*
           Center must be average
           of 5 middle positions.

           For a 5×5 normal
           associative construction,
           opposite pairs have
           equal sum.
        */


        /*
           Select center.
        */

        const centerIndex =
            Math.floor(
                Math.random()*25
            );


        const center =
            numbers[
                centerIndex
            ];


        /*
           Required pair sum.
        */

        const pairSum =
            targetSum - center;


        /*
           Remove center.
        */

        const remaining =
            numbers.filter(
                (_,i)=>
                    i!==centerIndex
            );


        /*
           Find 12 opposite pairs.
        */

        const pairs =
            findPairs(
                remaining,
                pairSum
            );


        if(
            pairs.length < 12
        ){

            continue;

        }


        /*
           Take first 12 pairs.
        */

        const selectedPairs =
            pairs.slice(
                0,
                12
            );


        /*
           Need one more number:
           center + 12 pairs = 25
        */

        const used = new Set();

        used.add(center);


        selectedPairs.forEach(
            pair=>{

                used.add(
                    pair[0]
                );

                used.add(
                    pair[1]
                );

            }
        );


        if(
            used.size !== 25
        ){

            continue;

        }


        /*
           Build 5×5 using
           associative magic-square
           pattern.
        */

        const values = [];


        selectedPairs.forEach(
            pair=>{

                values.push(
                    pair[0],
                    pair[1]
                );

            }
        );


        /*
           We need exactly
           24 outer numbers.
        */

        if(
            values.length !== 24
        ){

            continue;

        }


        const shuffled =
            shuffle(values);


        /*
           Fill square
           with opposite pairs.

           Pattern positions:
           
           a b c d e
           f g h i j
           k l m n o
           p q r s t
           u v w x y

           Opposite positions:
           a-y
           b-x
           c-w
           d-v
           e-u
           f-t
           g-s
           h-r
           i-q
           j-p
           k-o
           l-n

           Center = m
        */


        const square =
            Array.from(
                {length:5},
                () =>
                    Array(5).fill(0)
            );


        square[2][2] =
            center;


        let pairIndex = 0;


        const positions = [

            [[0,0],[4,4]],

            [[0,1],[4,3]],

            [[0,2],[4,2]],

            [[0,3],[4,1]],

            [[0,4],[4,0]],

            [[1,0],[3,4]],

            [[1,1],[3,3]],

            [[1,2],[3,2]],

            [[1,3],[3,1]],

            [[1,4],[3,0]],

            [[2,0],[2,4]],

            [[2,1],[2,3]]

        ];


        for(
            let p=0;
            p<positions.length;
            p++
        ){

            const pair =
                selectedPairs[p];


            if(!pair){

                break;

            }


            const pos =
                positions[p];


            square[
                pos[0][0]
            ][
                pos[0][1]
            ] =
                pair[0];


            square[
                pos[1][0]
            ][
                pos[1][1]
            ] =
                pair[1];

        }


        /*
           Validate.
        */

        if(
            validateSquare(
                square,
                total
            )
        ){

            return square;

        }

    }


    return null;

}


/* =====================================================
   FIND PAIRS
===================================================== */

function findPairs(
    numbers,
    target
){

    const result = [];

    const available =
        new Set(numbers);


    const shuffled =
        shuffle(numbers);


    for(
        let i=0;
        i<shuffled.length;
        i++
    ){

        const a =
            shuffled[i];


        const b =
            target-a;


        if(
            b===a
        ){

            continue;

        }


        if(
            available.has(b)
        ){

            result.push(
                [a,b]
            );


            available.delete(a);

            available.delete(b);

        }

    }


    return result;

}


/* =====================================================
   VALIDATE
===================================================== */

function validateSquare(
    square,
    total
){

    if(!square){

        return false;

    }


    const numbers = [];


    for(
        let r=0;
        r<5;
        r++
    ){

        for(
            let c=0;
            c<5;
            c++
        ){

            const n =
                square[r][c];


            if(
                n<0 ||
                n>100
            ){

                return false;

            }


            numbers.push(n);

        }

    }


    /*
       No duplicates.
    */

    if(
        new Set(numbers).size !== 25
    ){

        return false;

    }


    /*
       Rows.
    */

    for(
        let r=0;
        r<5;
        r++
    ){

        const sum =
            square[r].reduce(
                (a,b)=>a+b,
                0
            );


        if(
            sum !== total
        ){

            return false;

        }

    }


    /*
       Columns.
    */

    for(
        let c=0;
        c<5;
        c++
    ){

        let sum=0;


        for(
            let r=0;
            r<5;
            r++
        ){

            sum +=
                square[r][c];

        }


        if(
            sum !== total
        ){

            return false;

        }

    }


    /*
       Diagonal 1.
    */

    let d1=0;


    for(
        let i=0;
        i<5;
        i++
    ){

        d1 +=
            square[i][i];

    }


    if(
        d1 !== total
    ){

        return false;

    }


    /*
       Diagonal 2.
    */

    let d2=0;


    for(
        let i=0;
        i<5;
        i++
    ){

        d2 +=
            square[i][4-i];

    }


    if(
        d2 !== total
    ){

        return false;

    }


    return true;

}


/* =====================================================
   DISPLAY GAME
===================================================== */

function displayGame(){

    const table =
        document.getElementById(
            "magicTable"
        );


    table.innerHTML = "";


    if(!currentSquare){

        return;

    }


    /*
       Empty corner.
    */

    const corner =
        document.createElement(
            "div"
        );


    corner.className =
        "corner";


    table.appendChild(
        corner
    );


    /*
       Column totals.
    */

    for(
        let c=0;
        c<5;
        c++
    ){

        const total =
            document.createElement(
                "div"
            );


        total.className =
            "column-total";


        total.textContent =
            getColumnTotal(c);


        table.appendChild(
            total
        );

    }


    /*
       Rows.
    */

    for(
        let r=0;
        r<5;
        r++
    ){

        const rowTotal =
            document.createElement(
                "div"
            );


        rowTotal.className =
            "row-total";


        rowTotal.textContent =
            getRowTotal(
                currentSquare[r]
            );


        table.appendChild(
            rowTotal
        );


        /*
           Boxes.
        */

        for(
            let c=0;
            c<5;
            c++
        ){

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "box";


            box.textContent =
                currentSquare[r][c];


            const selected =
                selectedCells.some(
                    item =>
                        item.row===r &&
                        item.col===c
                );


            if(selected){

                box.classList.add(
                    "selected"
                );

            }


            box.onclick =
                function(){

                    selectCell(
                        r,
                        c,
                        box
                    );

                };


            table.appendChild(
                box
            );

        }

    }


    /*
       Diagonals.
    */

    document.getElementById(
        "diagonal1"
    ).textContent =
        getDiagonal1();


    document.getElementById(
        "diagonal2"
    ).textContent =
        getDiagonal2();


    updateSelectedDisplay();

}


/* =====================================================
   ROW TOTAL
===================================================== */

function getRowTotal(row){

    return row.reduce(
        (sum,n)=>sum+n,
        0
    );

}


/* =====================================================
   COLUMN TOTAL
===================================================== */

function getColumnTotal(column){

    let total=0;


    for(
        let r=0;
        r<5;
        r++
    ){

        total +=
            currentSquare[r][column];

    }


    return total;

}


/* =====================================================
   DIAGONAL 1
===================================================== */

function getDiagonal1(){

    let total=0;


    for(
        let i=0;
        i<5;
        i++
    ){

        total +=
            currentSquare[i][i];

    }


    return total;

}


/* =====================================================
   DIAGONAL 2
===================================================== */

function getDiagonal2(){

    let total=0;


    for(
        let i=0;
        i<5;
        i++
    ){

        total +=
            currentSquare[i][4-i];

    }


    return total;

}


/* =====================================================
   SELECT BOX
===================================================== */

function selectCell(
    row,
    col,
    box
){

    const index =
        selectedCells.findIndex(
            item =>
                item.row===row &&
                item.col===col
        );


    /*
       Remove.
    */

    if(index!==-1){

        selectedCells.splice(
            index,
            1
        );


        box.classList.remove(
            "selected"
        );


        updateSelectedDisplay();

        return;

    }


    /*
       Maximum 3.
    */

    if(
        selectedCells.length>=3
    ){

        alert(
            "You can select only 3 numbers."
        );

        return;

    }


    selectedCells.push({

        row:row,

        col:col,

        number:
            currentSquare[row][col]

    });


    box.classList.add(
        "selected"
    );


    updateSelectedDisplay();

}


/* =====================================================
   SELECTED DISPLAY
===================================================== */

function updateSelectedDisplay(){

    const element =
        document.getElementById(
            "selectedNumbers"
        );


    if(
        selectedCells.length===0
    ){

        element.textContent =
            "None";

        return;

    }


    element.textContent =
        selectedCells
        .map(
            item=>item.number
        )
        .join(
            "   •   "
        );

}


/* =====================================================
   APPLY SETTINGS
===================================================== */

function applySettings(){

    const gameId =
        document.getElementById(
            "gameIdSelect"
        ).value;


    const input =
        document.getElementById(
            "magicTotalInput"
        ).value;


    const total =
        Number(input);


    if(
        !Number.isInteger(total)
    ){

        alert(
            "Please enter a whole number for Magic Total."
        );

        return;

    }


    /*
       Minimum possible total:
       0+1+2+3+4 = 10
       for one row.

       Maximum possible total:
       100+99+98+97+96 = 490.
    */

    if(
        total<10 ||
        total>490
    ){

        alert(
            "Magic Total must be between 10 and 490."
        );

        return;

    }


    magicTotal =
        total;


    /*
       Generate.
    */

    const generated =
        generateMagicSquare(
            magicTotal
        );


    if(!generated){

        alert(
            "Could not create a valid 5×5 magic square for this Magic Total. Please try another total."
        );

        return;

    }


    currentSquare =
        generated;


    selectedCells = [];


    currentNumber =
        Number(
            gameId.replace(
                "MKND84",
                ""
            )
        );


    /*
       Save game.
    */

    saveConfiguration(
        gameId
    );


    displayGame();


    document.getElementById(
        "status"
    ).textContent =
        "VALID GAME ✓";


    document.getElementById(
        "savedMessage"
    ).textContent =
        gameId +
        " APPLIED ✓";

}


/* =====================================================
   SAVE CONFIGURATION
===================================================== */

function saveConfiguration(
    gameId
){

    const gameData = {

        gameId:
            gameId,

        gameType:
            "DIAMOND",

        gridSize:
            5,

        numberMin:
            0,

        numberMax:
            100,

        numbers:
            currentSquare,

        magicTotal:
            magicTotal,

        createdAt:
            new Date()
            .toISOString()

    };


    localStorage.setItem(

        "DIAMOND_GAME_" +
        gameId,

        JSON.stringify(
            gameData
        )

    );


    /*
       Active game.
    */

    localStorage.setItem(

        "ACTIVE_DIAMOND_GAME",

        gameId

    );

}


/* =====================================================
   SAVE GAME BUTTON
===================================================== */

function saveGame(){

    if(!currentSquare){

        alert(
            "Please APPLY a game first."
        );

        return;

    }


    const gameId =
        document.getElementById(
            "gameIdSelect"
        ).value;


    if(
        !validateSquare(
            currentSquare,
            magicTotal
        )
    ){

        alert(
            "Game is invalid."
        );

        return;

    }


    saveConfiguration(
        gameId
    );


    document.getElementById(
        "savedMessage"
    ).textContent =
        gameId +
        " SAVED ✓";

}


/* =====================================================
   NEXT GAME
===================================================== */

function nextGame(){

    currentNumber++;


    if(
        currentNumber>GAME_COUNT
    ){

        currentNumber=1;

    }


    const gameId =
        "MKND84" +
        String(currentNumber)
            .padStart(
                4,
                "0"
            );


    document.getElementById(
        "gameIdSelect"
    ).value =
        gameId;


    /*
       If Magic Total already entered,
       generate next game.
    */

    const input =
        document.getElementById(
            "magicTotalInput"
        ).value;


    const total =
        Number(input);


    if(
        total>=10 &&
        total<=490
    ){

        const generated =
            generateMagicSquare(
                total
            );


        if(generated){

            magicTotal =
                total;


            currentSquare =
                generated;


            selectedCells = [];


            saveConfiguration(
                gameId
            );


            displayGame();

        }

    }


    document.getElementById(
        "savedMessage"
    ).textContent = "";

}
