<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GAME GENERATOR</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#111;
}

.header{
    background:#111;
    color:white;
    text-align:center;
    padding:16px;
    font-size:22px;
    font-weight:bold;
}

.container{
    max-width:600px;
    margin:15px auto;
    padding:12px;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin:5px 0 15px;
    font-size:20px;
}

.setup{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.field input,
.field select{
    width:100%;
    height:42px;
    border:1px solid #bbb;
    border-radius:7px;
    padding:8px;
    font-size:16px;
}

.totalField{
    grid-column:1 / -1;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

button{
    border:none;
    border-radius:8px;
    height:44px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.applyBtn{
    flex:1;
    background:#1976d2;
    color:white;
}

.nextBtn{
    flex:1;
    background:#ff9800;
    color:white;
}

.saveBtn{
    width:100%;
    margin-top:10px;
    background:#2e7d32;
    color:white;
}

.gameInfo{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:7px;
    margin-top:15px;
}

.info{
    background:#eee;
    border-radius:7px;
    padding:8px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

.info span{
    display:block;
    margin-top:4px;
    font-size:14px;
}

/* =========================
   MAGIC GRID
========================= */

.gridTitle{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin:20px 0 8px;
}

.magicArea{
    display:flex;
    justify-content:center;
    margin-top:5px;
}

.magicTable{
    border-collapse:collapse;
}

.magicTable td{
    padding:3px;
}

/* 25 MAIN NUMBER BOXES */

.numberBox{
    width:58px;
    height:58px;
    background:white;
    border:2px solid #222;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    user-select:none;
}

.numberBox.selected{
    background:#2196f3;
    color:white;
    border-color:#0d47a1;
    transform:scale(.95);
}

.totalBox{
    width:42px;
    height:42px;
    background:#eeeeee;
    border:1px solid #999;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.corner{
    width:42px;
    height:42px;
}

.status{
    margin-top:12px;
    text-align:center;
    padding:10px;
    border-radius:8px;
    background:#e8f5e9;
    color:#1b5e20;
    font-weight:bold;
}

.status.error{
    background:#ffebee;
    color:#b71c1c;
}

.selectedTitle{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
}

.selectedNumbers{
    min-height:45px;
    margin-top:8px;
    padding:10px;
    background:#f5f5f5;
    border-radius:8px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.message{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    font-weight:bold;
}

@media(max-width:430px){

    .container{
        padding:8px;
    }

    .numberBox{
        width:51px;
        height:51px;
        font-size:18px;
    }

    .totalBox{
        width:35px;
        height:35px;
        font-size:11px;
    }

    .corner{
        width:35px;
    }

    .magicTable td{
        padding:2px;
    }
}
</style>
</head>

<script>

/* =========================================
   ORIGINAL 5 × 5 MAGIC SQUARE
   TOTAL = 60
========================================= */

const baseSquare = [

    [16,23,0,7,14],

    [22,4,6,13,15],

    [3,5,12,19,21],

    [9,11,18,20,2],

    [10,17,24,1,8]

];


let currentSquare = [];

let selectedCells = [];

let currentFrom = 0;

let currentTo = 24;

let currentMagicTotal = 60;

let currentGameId = "MKND840001";


/* =========================================
   RANDOM NUMBER
========================================= */

function randomInt(min,max){

    return Math.floor(
        Math.random() * (max-min+1)
    ) + min;

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array){

    let a = [...array];

    for(let i=a.length-1;i>0;i--){

        let j = randomInt(0,i);

        [a[i],a[j]] =
        [a[j],a[i]];

    }

    return a;
}


/* =========================================
   ROTATE
========================================= */

function rotate90(square){

    let n = square.length;

    let result =
        Array.from(
            {length:n},
            ()=>Array(n)
        );

    for(let r=0;r<n;r++){

        for(let c=0;c<n;c++){

            result[c][n-1-r] =
                square[r][c];

        }

    }

    return result;
}


/* =========================================
   FLIP
========================================= */

function flipHorizontal(square){

    return square.map(
        row => [...row].reverse()
    );

}


function flipVertical(square){

    return [...square]
        .reverse()
        .map(row=>[...row]);

}


/* =========================================
   TRANSFORMATION
========================================= */

function transformSquare(square){

    let result =
        square.map(row=>[...row]);

    let type =
        randomInt(0,7);

    if(type===1){

        result =
            rotate90(result);

    }

    else if(type===2){

        result =
            rotate90(
                rotate90(result)
            );

    }

    else if(type===3){

        result =
            rotate90(
                rotate90(
                    rotate90(result)
                )
            );

    }

    else if(type===4){

        result =
            flipHorizontal(result);

    }

    else if(type===5){

        result =
            flipVertical(result);

    }

    else if(type===6){

        result =
            flipHorizontal(
                rotate90(result)
            );

    }

    else if(type===7){

        result =
            flipVertical(
                rotate90(result)
            );

    }

    return result;
}


/* =========================================
   CREATE MAGIC SQUARE
========================================= */

function createMagicSquare(){

    let from = currentFrom;

    let to = currentTo;

    let target =
        currentMagicTotal;


    /*
       Current range must contain at least
       25 numbers.
    */

    let available = [];

    for(let n=from;n<=to;n++){

        available.push(n);

    }


    if(available.length < 25){

        return null;

    }


    /*
       We use a 25-number arithmetic set.

       For a 5×5 magic square:
       total of all 25 numbers
       must equal MAGIC TOTAL × 5.
    */

    let neededSum =
        target * 5;


    /*
       Try different arithmetic progressions
       inside the selected range.
    */

    let possible = [];


    for(let step=1;step<=Math.floor((to-from)/24);step++){

        for(
            let start=from;
            start + step*24 <= to;
            start++
        ){

            let sum =
                25*start +
                step*300;

            if(sum===neededSum){

                possible.push({
                    start:start,
                    step:step
                });

            }

        }

    }


    if(possible.length===0){

        return null;

    }


    let choice =
        possible[
            randomInt(
                0,
                possible.length-1
            )
        ];


    let values=[];

    for(let i=0;i<25;i++){

        values.push(
            choice.start +
            choice.step*i
        );

    }


    /*
       Map 0-24 magic square
       to the selected 25 numbers.
    */

    let square =
        baseSquare.map(row=>
            row.map(v=>
                values[v]
            )
        );


    /*
       Randomly change formation.
    */

    square =
        transformSquare(square);


    return square;

}


/* =========================================
   DISPLAY GAME
========================================= */

function displayGame(){

    for(let r=0;r<5;r++){

        for(let c=0;c<5;c++){

            let index =
                r*5+c;

            let box =
                document.getElementById(
                    "box"+index
                );

            box.textContent =
                currentSquare[r][c];

            box.classList.remove(
                "selected"
            );

        }

    }


    updateTotals();

}


/* =========================================
   UPDATE ROW / COLUMN TOTALS
========================================= */

function updateTotals(){

    for(let r=0;r<5;r++){

        let total=0;

        for(let c=0;c<5;c++){

            total +=
                currentSquare[r][c];

        }

        document.getElementById(
            "row"+r
        ).textContent=total;

    }


    for(let c=0;c<5;c++){

        let total=0;

        for(let r=0;r<5;r++){

            total +=
                currentSquare[r][c];

        }

        document.getElementById(
            "col"+c
        ).textContent=total;

    }


    checkGame();

}


/* =========================================
   CHECK MAGIC GAME
========================================= */

function checkGame(){

    let target =
        currentMagicTotal;

    let valid=true;


    /* ROWS */

    for(let r=0;r<5;r++){

        let sum=0;

        for(let c=0;c<5;c++){

            sum +=
                currentSquare[r][c];

        }

        if(sum!==target){

            valid=false;

        }

    }


    /* COLUMNS */

    for(let c=0;c<5;c++){

        let sum=0;

        for(let r=0;r<5;r++){

            sum +=
                currentSquare[r][c];

        }

        if(sum!==target){

            valid=false;

        }

    }


    /* DIAGONAL 1 */

    let d1=0;

    for(let i=0;i<5;i++){

        d1 +=
            currentSquare[i][i];

    }


    /* DIAGONAL 2 */

    let d2=0;

    for(let i=0;i<5;i++){

        d2 +=
            currentSquare[i][4-i];

    }


    if(d1!==target || d2!==target){

        valid=false;

    }


    let status =
        document.getElementById(
            "status"
        );


    if(valid){

        status.textContent =
            "VALID GAME ✓";

        status.classList.remove(
            "error"
        );

    }

    else{

        status.textContent =
            "INVALID GAME";

        status.classList.add(
            "error"
        );

    }

}


/* =========================================
   SELECT BOX
========================================= */

function selectBox(index){

    if(!currentSquare.length){

        return;

    }


    let box =
        document.getElementById(
            "box"+index
        );


    let existing =
        selectedCells.indexOf(index);


    /* UNSELECT */

    if(existing!==-1){

        selectedCells.splice(
            existing,
            1
        );

        box.classList.remove(
            "selected"
        );

        updateSelectedDisplay();

        return;

    }


    /* MAX 3 */

    if(selectedCells.length>=3){

        showMessage(
            "Only 3 numbers can be selected."
        );

        return;

    }


    selectedCells.push(index);

    box.classList.add(
        "selected"
    );

    updateSelectedDisplay();

}


/* =========================================
   SELECTED DISPLAY
========================================= */

function updateSelectedDisplay(){

    let display =
        document.getElementById(
            "selectedNumbers"
        );


    if(selectedCells.length===0){

        display.textContent =
            "Select 3 numbers";

        return;

    }


    let nums =
        selectedCells.map(index=>{

            let r =
                Math.floor(index/5);

            let c =
                index%5;

            return currentSquare[r][c];

        });


    display.textContent =
        nums.join("   |   ");


    if(selectedCells.length===3){

        display.textContent +=
            "   ✓";

    }

}


/* =========================================
   APPLY
========================================= */

function applySettings(){

    let from =
        parseInt(
            document.getElementById(
                "rangeFrom"
            ).value
        );

    let to =
        parseInt(
            document.getElementById(
                "rangeTo"
            ).value
        );

    let total =
        parseInt(
            document.getElementById(
                "magicTotal"
            ).value
        );


    if(
        isNaN(from) ||
        isNaN(to) ||
        isNaN(total)
    ){

        showMessage(
            "Enter all values."
        );

        return;

    }


    if(from<0 || to>200){

        showMessage(
            "Range must be between 0 and 200."
        );

        return;

    }


    if(from>=to){

        showMessage(
            "RANGE FROM must be smaller than RANGE TO."
        );

        return;

    }


    currentFrom =
        from;

    currentTo =
        to;

    currentMagicTotal =
        total;


    let square =
        createMagicSquare();


    if(!square){

        showMessage(
            "No valid 5×5 magic formation found for this Range and Magic Total."
        );

        return;

    }


    currentSquare =
        square;


    selectedCells=[];


    document.getElementById(
        "infoTotal"
    ).textContent =
        total;


    displayGame();

    updateSelectedDisplay();

    showMessage(
        "Game applied successfully ✓"
    );

}


/* =========================================
   NEXT
========================================= */

function nextGame(){

    if(
        currentFrom===undefined ||
        currentTo===undefined ||
        currentMagicTotal===undefined
    ){

        showMessage(
            "First press APPLY."
        );

        return;

    }


    let square =
        createMagicSquare();


    if(!square){

        showMessage(
            "No valid formation for current settings."
        );

        return;

    }


    currentSquare =
        square;


    /*
       Reset selections
    */

    selectedCells=[];


    displayGame();

    updateSelectedDisplay();

    showMessage(
        "NEW RANDOM GAME ✓"
    );

}


/* =========================================
   GAME ID
========================================= */

document.getElementById(
    "gameId"
).addEventListener(
    "change",
    function(){

        currentGameId =
            this.value;

        document.getElementById(
            "infoGameId"
        ).textContent =
            currentGameId;

        /*
           Corresponding Diamond Game ID
           is now active.
        */

        showMessage(
            currentGameId +
            " selected."
        );

    }
);


/* =========================================
   SAVE GAME
========================================= */

function saveGame(){

    if(!currentSquare.length){

        showMessage(
            "First generate a game."
        );

        return;

    }


    if(selectedCells.length!==3){

        showMessage(
            "Please select exactly 3 numbers."
        );

        return;

    }


    let selectedNumbers =
        selectedCells.map(index=>{

            let r =
                Math.floor(index/5);

            let c =
                index%5;

            return currentSquare[r][c];

        });


    let gameData={

        gameId:
            currentGameId,

        gameType:
            "DIAMOND",

        gridSize:
            5,

        rangeFrom:
            currentFrom,

        rangeTo:
            currentTo,

        magicTotal:
            currentMagicTotal,

        numbers:
            currentSquare,

        selectedNumbers:
            selectedNumbers,

        selectedPositions:
            selectedCells,

        createdAt:
            new Date().toISOString()

    };


    localStorage.setItem(

        "DIAMOND_" +
        currentGameId,

        JSON.stringify(
            gameData
        )

    );


    showMessage(
        "GAME SAVED ✓"
    );

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

    let el =
        document.getElementById(
            "message"
        );

    el.textContent=text;

    setTimeout(()=>{

        el.textContent="";

    },3000);

}


/* =========================================
   INITIAL GAME
========================================= */

currentSquare =
    baseSquare.map(row=>[...row]);

displayGame();

</script>
